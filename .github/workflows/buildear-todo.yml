name: Build TODOOO Stock Kernel

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Select the release type"
        required: true
        type: choice
        options:
          - actions
          - prerelease
          - release
        default: actions

      oneui_version:
        description: "Select the One UI target to build"
        required: true
        type: choice
        options:
          - oneui8
          - oneui8.5
          - all
        default: all

      # Kernel Modifications
      LinkTO:
        description: "Choose LTO Mode"
        required: true
        type: choice
        options:
          - default
          - thin
          - full
          - all
        default: default

      ksu_variant:
        description: "Choose Root Variant"
        required: true
        type: choice
        options:
          - ksu-next
        default: ksu-next

      ksun_branch:
        description: "Choose Ksu-Next Variant"
        required: true
        type: choice
        options:
          - dev
          - stable
          - both
        default: stable
        
concurrency:
  group: build-kernels-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: |
      A356E Stock One UI
      ${{
        matrix.branch == 'oneui8' && '8' ||
        matrix.branch == 'oneui8.5' && '8.5'
      }}
      - ${{ matrix.lto }} LTO

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(inputs.oneui_version == 'all' && '["oneui8","oneui8.5"]' || format('["{0}"]', inputs.oneui_version)) }}
        lto: ${{ fromJSON(inputs.LinkTO == 'all' && '["default","thin","full"]' || format('["{0}"]', inputs.LinkTO)) }}
        ksun_branch: ${{ fromJSON(inputs.ksun_branch == 'both' && '["stable","dev"]' || format('["{0}"]', inputs.LinkTO)) }}
    env:
      KERNEL_DIR: ${{ github.workspace }}/A356E-Kernel
      TOOLCHAIN_DIR: ${{ github.workspace }}/A356E-toolchain
      ANYKERNEL3_DIR: ${{ github.workspace }}/A356E-Anykernel3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare to build
        uses: ./.github/actions/build-setup
        with:
          repos_token: ${{ secrets.REPOS_TOKEN }}
          branch: ${{ matrix.branch }}
          free_diskspace: true

      - name: Setup Swap Memory
        uses: ./.github/actions/SetupSwapMemory
        with:
          LinkTO: ${{ matrix.lto }}

      - name: Prepare kernel to modifications
        uses: ./.github/actions/desactivate-securities
        
      - name: Apply Kernel Modifications
        uses: ./.github/actions/modify-kernel
        with:
          LinkTO: ${{ inputs.LinkTO }}
          ksu_variant: ${{ inputs.ksu_variant }}
          ksun_branch: ${{ inputs.ksun_branch }}

      - name: Build kernel
        uses: ./.github/actions/build-kernel
        with:
          LinkTO: ${{ matrix.lto }}
          branch: ${{ matrix.branch }}

      - name: Upload files to artifacts
        uses: ./.github/actions/UploadArtifacts
        with:
          oneui_version: ${{ env.ONEUI_VERSION }}
          kernel_build: "stock"
          LinkTO: ${{ matrix.lto }}

  Upload2Release:
    name: Upload Artifacts to Release
    needs: build
    if: |
      inputs.release_type != 'actions' &&
      needs.build.result == 'success'

    env:
      GH_TOKEN: ${{ github.token }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish Artifacts to Release
        uses: ./.github/actions/Artifacts2release
        with:
          prerelease: ${{ inputs.release_type == 'prerelease' }}

          release_name: "A356E Stock Image/Kernel"
          release_tag: "v1.0.${{ github.run_number }}"
          release_body: |
            ## These files are essentially stock, with LTO variants.

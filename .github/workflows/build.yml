name: Build Kernel

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      branch:
        description: "Kernel source branch"
        required: true
        type: string

      ksu_variant:
        description: "KernelSU variant"
        required: true
        type: string

      susfs:
        description: "Enable SUSFS"
        required: true
        type: boolean

      lto:
        required: true
        type: boolean

jobs:
  build:
    name: "Build ${{ inputs.branch }} kernel"
    runs-on: ubuntu-latest
    
    env:
      kernel_dir: ${{ github.workspace }}/A356E-Kernel
      toolchain_dir: ${{ github.workspace }}/A356E-toolchain

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.REPOS_TOKEN }}
          
      - name: Prepare directories
        run: |
          echo "Removing directories..."
          rm -rf "$kernel_dir" "$toolchain_dir"
          
          echo "Creating directories..."
          mkdir "$kernel_dir" "$toolchain_dir"
          echo "Directories created :P"
          
      - name: Clone kernel source
        run: |
          echo "========================================"
          echo "Building: ${{ inputs.branch }} kernels"
          echo "========================================"

          git clone \
            --depth 1 \
            --single-branch \
            -b "${{ inputs.branch }}" \
            https://github.com/Zaahen7/A356E-KernelSources.git \
            "$kernel_dir"

          ls "$kernel_dir"
            
      - name: Clone Samsung Toolchain
        run: |
          cd "$GITHUB_WORKSPACE/${{ inputs.branch }}-kernel"

          git clone \
            --depth 1 \
            git@github.com:Zaahen7/A356E-toolchain.git \
            "$toolchain_dir"

          ls "$toolchain_dir"

      - name: Build kernel
        run: |
          cd "$KERNEL_DIR"

          echo "========================================"
          echo "Build configuration"
          echo "========================================"

          echo "Branch:        ${{ inputs.branch }}"
          echo "KernelSU:      ${{ inputs.ksu_variant }}"
          echo "SUSFS:         ${{ inputs.susfs }}"
          echo "LTO:           ${{ inputs.lto }}"

          echo "========================================"

          # ==================================================
          # TU COMANDO DE BUILD VA ACÁ
          # ==================================================

          # ./build.sh


      # ========================================================
      # CLEANUP
      # ========================================================

      - name: Cleanup kernel source
        if: always()
        run: |
          echo "Cleaning used directories..."
          rm -rf "$kernel_dir" "$toolchain_dir"
          echo "Cleanup completed."

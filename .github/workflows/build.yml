name: Build Kernel

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      branch:
        description: "Kernel source branch"
        required: true
        type: string

      ksu_variant:
        description: "KernelSU variant"
        required: true
        type: string

      susfs:
        description: "Enable SUSFS"
        required: true
        type: boolean

      lto:
        required: true
        type: string

jobs:
  build:
    name: "Build ${{ inputs.branch }} kernel"
    runs-on: ubuntu-latest
    
    env:
      kernel_dir: ${{ github.workspace }}/A356E-Kernel
      toolchain_dir: ${{ github.workspace }}/A356E-toolchain

    steps: 
      - name: Configure Git authentication
        run: |
          git config --global url."https://x-access-token:${{ secrets.REPOS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Prepare directories
        run: |
          echo "Removing directories..."
          rm -rf "$kernel_dir" "$toolchain_dir"
          
          echo "Creating directories..."
          mkdir "$kernel_dir" "$toolchain_dir"
          echo "Directories created :P"
          
      - name: Clone kernel source
        run: |
          echo "========================================"
          echo "Building: ${{ inputs.branch }} kernels"
          echo "========================================"

          git clone \
            --depth 1 \
            --single-branch \
            -b "${{ inputs.branch }}" \
            https://github.com/Zaahen7/A356E-KernelSources.git \
            "$kernel_dir"
            
          echo "listado:"
          ls "$kernel_dir"
            
      - name: Samsung Toolchain Setup
        run: |
          git clone \
            --depth 1 \
            https://github.com/Zaahen7/A356E-toolchain.git \
            "$toolchain_dir"

          echo ""
          echo "listado:"
          ls "$toolchain_dir"

          echo ""
          echo "Extracting .tar.xz files"
          for archive in "$toolchain_dir"/*.tar.xz; do
            echo "Extracting: $(basename "$archive")"
            tar -xJf "$archive" -C "$toolchain_dir"
            rm -f "$archive"
          done

          echo ""
          echo "listado:"
          ls "$toolchain_dir"


      - name: Build kernel
        run: |
          cd "$KERNEL_DIR"

          echo "========================================"
          echo "Build configuration"
          echo "========================================"

          echo "Branch:        ${{ inputs.branch }}"
          echo "KernelSU:      ${{ inputs.ksu_variant }}"
          echo "SUSFS:         ${{ inputs.susfs }}"
          echo "LTO:           ${{ inputs.lto }}"

          echo "========================================"

          # ==================================================
          # TU COMANDO DE BUILD VA ACÁ
          # ==================================================

          # ./build.sh


      # ========================================================
      # CLEANUP
      # ========================================================

      - name: Cleanup kernel source
        if: always()
        run: |
          echo "Cleaning used directories..."
          rm -rf "$kernel_dir" "$toolchain_dir"
          echo "Cleanup completed."

# Workflow made by @Zaahen7
name: Build GutsKernel
permissions:
  contents: write
  
on:
  workflow_dispatch:
    inputs:
        welcome:
          description: "Workflow Made by @Zaahen7"
          type: choice
          options:
            - "Check the kernel variant below"
          default: "Check the kernel variant below"
          required: true

        clean-variant:
          description: "Clean"
          type: boolean
          default: true
          
        ksu-variant:
          description: "KernelSU"
          type: boolean
          default: true
          
        ksun-variant:
          description: "KernelSU-Next"
          type: boolean
          default: true
          
        bakasu-variant:
          description: "Baka-SU"
          type: boolean
          default: true

        finasu-variant:
          description: "Fina-SU"
          type: boolean
          default: true
        
        oneui-version:
          description: "One UI Version"
          required: true
          type: choice
          options:
            - 8.5
          default: "8.5"
          
        lto-mode:
          description: "Link Time Optimization(LTO) Mode"
          required: true
          type: choice
          options:
            - Default
            - Thin
            - Full
          default: Full
          
    # Kernel Modifications

        disable-securities:
          description: "Disable Samsung Securities"
          type: boolean
          default: true
        
        kernel-patches:
          description: "Apply kernel optimization patches"
          type: boolean
          default: true
          
        susfs:
          description: "Enable SUSFS"
          type: boolean
          default: true
          
        bbg:
          description: "Enable Baseband Guard"
          type: boolean
          default: true
          
        netsch:
          description: "Enable more NET schedulers"
          type: boolean
          default: true
          
        bbrv3:
          description: "Add BBR & BBRv3"
          type: boolean
          default: true
          
        ext-tmpfs:
          description: "Add Mountify Support"
          type: boolean
          default: true
          
        vfs-support:
          description: "Add VFS support for selected MetaModule"
          type: choice
          options:
            - Disabled
            - NoMount
            - Hybrid-Mount
          default: Hybrid-Mount
          
        battery-tweak:
          description: "EXPERIMENTAL battery tweak"
          type: boolean
          default: false
          
        release-type:
            description: "Release type"
            required: true
            type: choice
            options:
              - Actions
              - Prerelease
              - Release
            default: Actions
            
concurrency:
    group: GutsKernels-${{ github.ref }}
    cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  get-date:
    name: Get todays date for zip names xD
    runs-on: ubuntu-latest
    outputs:
      build_date: ${{ steps.date.outputs['build_date'] }}
    steps:
      - id: date
        run: echo "build_date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
        
  build-kernel:
    name: GutsKernel One UI ${{ inputs['oneui-version'] }} - ${{ matrix.variant }}
    needs: get-date
    if: ${{ inputs['clean-variant'] || inputs['ksu-variant'] || inputs['ksun-variant'] || inputs['bakasu-variant'] || inputs['finasu-variant'] }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: >-
          ${{ fromJSON(format(
            '[{0}{1}{2}{3}{4}]',
            inputs['clean-variant'] && '"CLEAN"' ||
              inputs['ksu-variant'] && '"KSU"' ||
              inputs['ksun-variant'] && '"KSUN"' ||
              inputs['bakasu-variant'] && '"BAKASU"' ||
              inputs['finasu-variant'] && '"FINASU"' ||  '"CLEAN"',
            inputs['ksu-variant'] && inputs['clean-variant'] && ',"KSU"' || '',
            inputs['ksun-variant'] && (inputs['clean-variant'] || inputs['ksu-variant']) && ',"KSUN"' || '',
            inputs['bakasu-variant'] && (inputs['clean-variant'] || inputs['ksu-variant'] || inputs['ksun-variant']) && ',"BAKASU"' || '',
            inputs['finasu-variant'] && (inputs['clean-variant'] || inputs['ksu-variant'] || inputs['ksun-variant'] || inputs['bakasu-variant']) && ',"FINASU"' || ''
          )) }}
    
    env:
      BUILD_DATE: ${{ needs.get-date.outputs['build_date'] }}
      KERNEL_DIR: ${{ github.workspace }}/GutsKernel
      TOOLCHAIN_DIR: ${{ github.workspace }}/Toolchain
      ANYKERNEL3_DIR: ${{ github.workspace }}/Anykernel3
      LTO_MODE: ${{ inputs['lto-mode'] }}
      ONEUI_VERSION: ${{ inputs['oneui-version'] }}
      DEFCONFIG: ${{ github.workspace }}/GutsKernel/arch/arm64/configs/s5e8835-a35xjvxx_defconfig
      DEVICE_MODEL: "A356E"
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Prepare to build
        uses: ./.github/actions/build-setup
        with:
          free-diskspace: "Guts"
     
      - name: Apply Kernel Modifications
        uses: ./.github/actions/modify-kernel
        with:
          disable-securities: ${{ inputs['disable-securities'] }}
          apply-kpatches: ${{ inputs['kernel-patches'] }}
          kernel-variant: ${{ matrix.variant }}
          enable-susfs: ${{ inputs.susfs }}
          enable-bbg: ${{ inputs.bbg }}
          enable-netsch: ${{ inputs.netsch }}
          enable-bbrv3: ${{ inputs.bbrv3 }}
          extended-tmpfs: ${{ inputs['ext-tmpfs'] }}
          vfs-support: ${{ inputs['vfs-support'] }}
          battery-tweak: ${{ inputs['battery-tweak'] }}

      - name: Build Kernel
        uses: ./.github/actions/build-kernel
        with:
          lto-mode: ${{ inputs['lto-mode'] }}

      - name: Upload files to artifacts
        uses: ./.github/actions/upload-artifacts
        with:
          kernel-variant: ${{ matrix.variant }}
          
  Artifacts2Release:
    name: Upload Artifacts to Release
    needs: [get-date, build-kernel]
    if: ${{ inputs['release-type'] != 'Actions' && needs['build-kernel'].result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: GutsKernel*
          path: build-artifacts
          if-no-files-found: error

      - name: Zip artifacts
        shell: bash
        run: |
          set -e
          cd build-artifacts
          for d in */; do
            [ -d "$d" ] || continue
            (cd "$d" && zip -r9 "../${d%/}.zip" .)
          done
          
      - name: Publish Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ inputs['oneui-version'] }}
          target_commitish: ${{ github.sha }}
          name: GutsKernel for A356E Oneui ${{ inputs['oneui-version'] }}-${{ needs['get-date'].outputs['build_date'] }}
          body: |
             ### 📋 Changelog
             - Initial public release of GutsKernel.
             - Included prebuilt kernel packages.
             
             ### 📲 How to Flash:
             - Flash the kernel through a Custom Recovery. Alternatively, if you already have root access, you can flash it using the KernelSU-Next app by selecting the **AnyKernel3** installation method.
             
             ### 📝 Note:
             - Inside each kernel ZIP, you will find a `kernel-info.txt` file containing information about the kernel, applied modifications, and commit hashes of the repositories used during the build.
          prerelease: ${{ inputs['release-type'] == 'Prerelease' }}
          make_latest: ${{ inputs['release-type'] == 'Release' }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: build-artifacts/*.zip

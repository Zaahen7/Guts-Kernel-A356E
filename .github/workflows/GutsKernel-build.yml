# Workflow made by @Zaahen7
name: Build GutsKernel
permissions:
  contents: write
  actions: write
  
on:
  workflow_dispatch:
    inputs:
        welcome:
          description: "Workflow Made by @Zaahen7"
          type: choice
          options:
            - "Check the kernel variant below"
          default: "Check the kernel variant below"
          required: true

        puck-variant:
          description: "Puck / Clean"
          type: boolean
          default: true
          
        zodd-variant:
          description: "Zodd / KernelSU from tiann"
          type: boolean
          default: true
          
        femto-variant:
          description: "Femto / KernelSU-Next"
          type: boolean
          default: true
          
        zoro-variant:
          description: "Zoro / Resuki-SU"
          type: boolean
          default: true
          
        oneui-version:
          description: "One UI Version"
          required: true
          type: choice
          options:
            - 8.5
            - 8
          default: "8.5"
        
        lto-mode:
          description: "Link Time Optimization(LTO) Mode"
          required: true
          type: choice
          options:
            - Default
            - Thin
            - Full
          default: Full
                  
# Kernel Modifications
        
        kernel-patches:
          description: "Apply kernel optimization patches"
          type: boolean
          default: true
          
        susfs:
          description: "Enable SUSFS"
          type: boolean
          default: true
          
        bbg:
          description: "Enable Baseband Guard"
          type: boolean
          default: true
          
        netsch:
          description: "Enable more NET schedulers & Wireguard support"
          type: boolean
          default: true
          
        bbrv3:
          description: "Add BBR & BBRv3"
          type: boolean
          default: true
        
        vfs-support:
          description: "Add VFS support for Hybrid Mount MetaModule"
          type: boolean
          default: true

        battery-tweak:
          description: "EXPERIMENTAL battery tweak"
          type: boolean
          default: false
          
        release-type:
            description: "Release type"
            required: true
            type: choice
            options:
              - Actions
              - Prerelease
              - Release
            default: Actions

concurrency:
    group: GutsKernels-${{ github.ref }}
    cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-kernel:
    name: GutsKernel One UI ${{ inputs.oneui-version }} - ${{ matrix.variant }}
    if: ${{ inputs.puck-variant || inputs.zodd-variant || inputs.femto-variant || inputs.zoro-variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: >-
          ${{ fromJSON(format(
            '[{0}{1}{2}{3}]',
            inputs.puck-variant && '"Puck"' ||
              inputs.zodd-variant && '"Zodd"' ||
              inputs.femto-variant && '"Femto"' ||
              inputs.zoro-variant && '"Zoro"' || '"Puck"',
            inputs.zodd-variant && inputs.puck-variant && ',"Zodd"' || '',
            inputs.femto-variant && (inputs.puck-variant || inputs.zodd-variant) && ',"Femto"' || '',
            inputs.zoro-variant && (inputs.puck-variant || inputs.zodd-variant || inputs.femto-variant) && ',"Zoro"' || ''
          )) }}
    
    env:
      KERNEL_DIR: ${{ github.workspace }}/GutsKernel
      TOOLCHAIN_DIR: ${{ github.workspace }}/Toolchain
      ANYKERNEL3_DIR: ${{ github.workspace }}/Anykernel3
      LTO_MODE: ${{ inputs.lto-mode }}
      ONEUI_VERSION: ${{ inputs.oneui-version }}
      DEFCONFIG: ${{ github.workspace }}/GutsKernel/arch/arm64/configs/s5e8835-a35xjvxx_defconfig

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Prepare to build
        uses: ./.github/actions/build-setup
        with:
          free-diskspace: true
     
      - name: Apply Kernel Modifications
        uses: ./.github/actions/modify-kernel
        with:
          apply-kpatches: ${{ inputs.kernel-patches }}
          kernel-variant: ${{ matrix.variant }}
          enable-susfs: ${{ inputs.susfs }}
          enable-bbg: ${{ inputs.bbg }}
          enable-netsch: ${{ inputs.netsch }}
          enable-bbrv3: ${{ inputs.bbrv3 }}
          vfs-support: ${{ inputs.vfs-support }}
          battery-tweak: ${{ inputs.battery-tweak }}

      - name: Build Kernel
        uses: ./.github/actions/build-kernel
        with:
          lto-mode: ${{ inputs.lto-mode }}
          variant: ${{ matrix.variant }}

      - name: Upload files to artifacts
        uses: ./.github/actions/upload-artifacts
        with:
          variant: ${{ matrix.variant }}

  Artifacts2Release:
    name: Upload Artifacts to Release
    needs: build-kernel
    if: |
      inputs.release-type != 'Actions' &&
      needs.build-kernel.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Publish Artifacts to Release
        uses: ./.github/actions/artifacts2release
        with:
          prerelease: ${{ inputs.release-type == 'Prerelease' }}

          # Release Details
          release_name: "GutsKernel for A356E"
          release_tag: "v1.0.${{ github.run_number }}"

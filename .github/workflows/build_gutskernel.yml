# Workflow made by @Zaahen7
name: Build GutsKernel
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Select the release type"
        required: true
        type: choice
        options:
          - actions
          - prerelease
          - release
        default: actions

      oneui_version:
        description: "Select the One UI target to build"
        required: true
        type: choice
        options:
          - oneui8
          - oneui8.5
          - all
        default: all
        
      output_files:
        description: "Select the output files"
        required: true
        type: choice
        options:
          - image
          - flashable-zip
          - both
        default: both

  # Kernel Modifications
      lto:
        description: "Choose LTO build"
        required: true
        type: choice
        options:
          - default
          - full
        default: full

concurrency:
    group: build-kernels-${{ github.ref }}
    cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build_oneui8:
    name: A356E Stock One UI 8
    if: inputs.oneui_version == 'oneui8' || inputs.oneui_version == 'all'
    runs-on: ubuntu-latest
    
    env:
      KERNEL_DIR: ${{ github.workspace }}/A356E-Kernel
      TOOLCHAIN_DIR: ${{ github.workspace }}/A356E-toolchain
      ANYKERNEL3_DIR: ${{ github.workspace }}/A356E-Anykernel3
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Prepare to build
        uses: ./.github/actions/build-setup
        with:
          repos_token: ${{ secrets.REPOS_TOKEN }}
          branch: oneui8
          output_files: ${{ inputs.output_files }}

      - name: Build kernel
        uses: ./.github/actions/build-kernel

      - name: Upload files to artifacts
        uses: ./.github/actions/UploadArtifacts
        with:
          output_files: ${{ inputs.output_files }}
          oneui_version: "8"
          
  build_oneui8-5:
    name: A356E Stock One UI 8.5
    if: inputs.oneui_version == 'oneui8.5' || inputs.oneui_version == 'all'
    runs-on: ubuntu-latest
    
    env:
      KERNEL_DIR: ${{ github.workspace }}/A356E-Kernel
      TOOLCHAIN_DIR: ${{ github.workspace }}/A356E-toolchain
      ANYKERNEL3_DIR: ${{ github.workspace }}/A356E-Anykernel3
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare to build
        uses: ./.github/actions/build-setup
        with:
          repos_token: ${{ secrets.REPOS_TOKEN }}
          branch: oneui8.5
          output_files: ${{ inputs.output_files }}

      - name: Setup more Swap Memory
        if: inputs.lto == 'full'
        uses: ./.github/actions/SetupSwapMemory
        with:
          # Size in GB
          swap_size: 25

      - name: Apply Modifications
        uses: ./.github/actions/modify-kernel
        with:
          lto: ${{ inputs.lto }}

      - name: Build kernel
        uses: ./.github/actions/build-kernel   
          
      - name: Upload files to artifacts
        uses: ./.github/actions/UploadArtifacts
        with:
          output_files: ${{ inputs.output_files }}
          oneui_version: "8-5"

  Upload2Release:
    name: Upload Artifacs to Release
    needs:
      - build_oneui8
      - build_oneui8-5
    if: |
      inputs.release_type != 'actions' &&
      always() &&
      (needs.build_oneui8.result == 'success' || needs.build_oneui8.result == 'skipped') &&
      (needs.build_oneui8-5.result == 'success' || needs.build_oneui8-5.result == 'skipped')
    
    env:
      GH_TOKEN: ${{ github.token }}
      
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Publish Artifacts to Release
        uses: ./.github/actions/Artifacts2release
        with:
          prerelease: ${{ inputs.release_type == 'prerelease' }}

          # Release Details
          release_name: "A356E Stock Image/Kernel"
          release_tag: "v1.0.${{ github.run_number }}"
          release_body: |
            ## These files are essentially stock, with no modifications.

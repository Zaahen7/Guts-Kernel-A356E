# Workflow made by @Zaahen7
name: Build GutsKernel
permissions:
  contents: write
  actions: write
  
on:
  workflow_dispatch:
    inputs:
        puck-variant:
          description: "Kernel Variants to build"
          required: true
          type: choice
          options:
            - Puck / Clean (Needed)
          default: Puck / Clean (Needed)
          
        zodd-variant:
          description: "Zodd / KernelSU from tiann"
          type: boolean
          default: true
          
        femto-variant:
          description: "Femto / KernelSU-Next"
          type: boolean
          default: true
          
        zoro-variant:
          description: "Zoro / Resuki-SU"
          type: boolean
          default: true
          
        oneui-version:
          description: "One UI Version"
          required: true
          type: choice
          options:
            - 8.5
            - 8
          default: "8.5"
        
        lto-mode:
          description: "Link Time Optimization(LTO) Mode"
          required: true
          type: choice
          options:
            - Default
            - Thin
            - Full
          default: Full
                  
# Kernel Modifications
        
        kernel-patches:
          description: "Kernel optimization patches"
          required: true
          type: choice
          options:
            - None
            - All
          default: All
          
        susfs:
          description: "SUSFS"
          required: true
          type: choice
          options:
            - Disabled
            - Stable
            - Latest
          default: Stable
          
        enable-bbg:
          description: "Enable Baseband Guard"
          type: boolean
          default: true
          
        enable-netsch:
          description: "Enable more NET schedulers"
          type: boolean
          default: true
          
        enable-bbrv3:
          description: "Add BBR & BBRv3"
          type: boolean
          default: true
          
        release-type:
            description: "Release type"
            required: true
            type: choice
            options:
              - Actions
              - Prerelease
              - Release
            default: Actions
            
        skip-build:
          description: "Use test Image to test workflow"
          type: boolean
          default: true

concurrency:
    group: GutsKernels-${{ github.ref }}
    cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-kernel:
    name: GutsKernel One UI ${{ inputs.oneui-version }}
    runs-on: ubuntu-latest
    
    env:
      KERNEL_DIR: ${{ github.workspace }}/GutsKernel
      TOOLCHAIN_DIR: ${{ github.workspace }}/Toolchain
      ANYKERNEL3_DIR: ${{ github.workspace }}/Anykernel3
      LTO_MODE: ${{ inputs.lto-mode }}
      ONEUI_VERSION: ${{ inputs.oneui-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Prepare to build
        uses: ./.github/actions/build-setup
        with:
          repos-token: ${{ secrets.REPOS_TOKEN }}
          free-diskspace: true
          
      - name: Apply Kernel Modifications
        uses: ./.github/actions/modify-kernel
        with:
          kernel-patches: ${{ inputs.kernel-patches }}
          susfs: ${{ inputs.susfs }}
          enable-bbg: ${{ inputs.enable-bbg }}
          enable-netsch: ${{ inputs.enable-netsch }}
          enable-bbrv3: ${{ inputs.enable-bbrv3 }}

      - name: Build Kernel
        uses: ./.github/actions/build-kernel
        with:
          lto-mode: ${{ inputs.lto-mode }}

      - name: Upload files to artifacts
        uses: ./.github/actions/UploadArtifacts
        with:
          oneui_version: ${{ env.ONEUI_VERSION }}
          kernel_build: "stock"

          #Modifications
          lto-mode: ${{ inputs.lto-mode }}

  Upload2Release:
    name: Upload Artifacs to Release
    needs: build-kernel
    if: |
      inputs.release-type != 'actions' &&
      needs.build-kernel.result == 'success'
    
    env:
      GH_TOKEN: ${{ github.token }}
      
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Publish Artifacts to Release
        uses: ./.github/actions/Artifacts2release
        with:
          prerelease: ${{ inputs.release-type == 'prerelease' }}

          # Release Details
          release_name: "GutsKernel for A356E"
          release_tag: "v1.0.${{ github.run_number }}"
          release_body: |
            ## These files are essentially stock, with no modifications.

# Workflow made by @Zaahen7
name: Build GutsKernel for A356E
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
        skip-build:
          description: "Skip kernel compilation and use test Image"
          required: true
          type: boolean
          default: true
          
        release_type:
            description: "Select the release type"
            required: true
            type: choice
            options:
              - actions
              - prerelease
              - release
            default: actions
      
        oneui_version:
          description: "Select the One UI target to build"
          required: true
          type: choice
          options:
            - oneui8
            - oneui8.5
            - all
          default: all
  
    # Kernel Modifications
        LinkTO:
          description: "Choose LTO Mode"
          required: true
          type: choice
          options:
            - default
            - thin
            - full
          default: full

concurrency:
    group: build-kernels-${{ github.ref }}
    cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: |
      GutsKernel One UI
      ${{
        matrix.branch == 'oneui8' && '8' ||
        matrix.branch == 'oneui8.5' && '8.5'
      }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        branch: >-
          ${{ fromJSON(inputs.oneui_version == 'all' &&
          '["oneui8","oneui8.5"]' || format('["{0}"]', inputs.oneui_version)) }}
    env:
      KERNEL_DIR: ${{ github.workspace }}/A356E-Kernel
      TOOLCHAIN_DIR: ${{ github.workspace }}/A356E-toolchain
      ANYKERNEL3_DIR: ${{ github.workspace }}/A356E-Anykernel3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare to build
        uses: ./.github/actions/build-setup
        with:
          repos_token: ${{ secrets.REPOS_TOKEN }}
          branch: ${{ matrix.branch }}
          free_diskspace: true

      - name: Setup Swap Memory
        uses: ./.github/actions/SetupSwapMemory
        with:
          LinkTO: ${{ inputs.LinkTO }}

      - name: Apply Kernel Modifications
        uses: ./.github/actions/modify-kernel
        with:
          LinkTO: ${{ inputs.LinkTO }}

      - name: Build Kernel
        uses: ./.github/actions/build-kernel
        with:
          LinkTO: ${{ inputs.LinkTO }}

      - name: Upload files to artifacts
        uses: ./.github/actions/UploadArtifacts
        with:
          oneui_version: ${{ env.ONEUI_VERSION }}
          kernel_build: "stock"

          #Modifications
          LinkTO: ${{ inputs.LinkTO }}
      
  build_oneui8:
    name: GutsKernel Oneui 8
    if: inputs.oneui_version == 'oneui8' || inputs.oneui_version == 'all'
    runs-on: ubuntu-latest
    
    env:
      KERNEL_DIR: ${{ github.workspace }}/A356E-Kernel
      TOOLCHAIN_DIR: ${{ github.workspace }}/A356E-toolchain
      ANYKERNEL3_DIR: ${{ github.workspace }}/A356E-Anykernel3
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Prepare to build
        uses: ./.github/actions/build-setup
        with:
          repos_token: ${{ secrets.REPOS_TOKEN }}
          branch: oneui8
          kernel_build: "guts"

      - name: Setup Swap Memory
        if: inputs.lto == 'full'
        uses: ./.github/actions/SetupSwapMemory
        with:
          # Size in GB
          swap_size: 25

      - name: Apply Modifications
        uses: ./.github/actions/modify-kernel
        with:
          lto: ${{ inputs.lto }}

      - name: Build kernel
        if: ${{ !inputs.skip-build }}
        uses: ./.github/actions/build-kernel

      - name: Create dummy Image file
        if: inputs.skip-build
        shell: bash
        run: |
          mkdir -p "$KERNEL_DIR/arch/arm64/boot"
          echo "DUMMY KERNEL IMAGE FOR PIPELINE TEST" > "$KERNEL_DIR/arch/arm64/boot/Image"
          ls -lh "$KERNEL_DIR/arch/arm64/boot/Image"

      - name: Upload files to artifacts
        uses: ./.github/actions/UploadArtifacts
        with:
          oneui_version: "8"
          kernel_build: "guts"
          lto: ${{ inputs.lto }}
          
  build_oneui8-5:
    name: GutsKernel Oneui 8.5
    if: inputs.oneui_version == 'oneui8.5' || inputs.oneui_version == 'all'
    runs-on: ubuntu-latest
    
    env:
      KERNEL_DIR: ${{ github.workspace }}/A356E-Kernel
      TOOLCHAIN_DIR: ${{ github.workspace }}/A356E-toolchain
      ANYKERNEL3_DIR: ${{ github.workspace }}/A356E-Anykernel3
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare to build
        uses: ./.github/actions/build-setup
        with:
          repos_token: ${{ secrets.REPOS_TOKEN }}
          branch: oneui8.5
          kernel_build: "guts"

      - name: Setup Swap Memory
        if: inputs.lto == 'full'
        uses: ./.github/actions/SetupSwapMemory
        with:
          # Size in GB
          swap_size: 25

      - name: Apply Modifications
        uses: ./.github/actions/modify-kernel
        with:
          lto: ${{ inputs.lto }}

      - name: Build kernel
        if: ${{ !inputs.skip-build }}
        uses: ./.github/actions/build-kernel
        
      - name: Create dummy Image file
        if: inputs.skip-build
        shell: bash
        run: |
          mkdir -p "$KERNEL_DIR/arch/arm64/boot"
          echo "DUMMY KERNEL IMAGE FOR PIPELINE TEST" > "$KERNEL_DIR/arch/arm64/boot/Image"
          ls -lh "$KERNEL_DIR/arch/arm64/boot/Image"
          
      - name: Upload files to artifacts
        uses: ./.github/actions/UploadArtifacts
        with:
          oneui_version: "8-5"
          kernel_build: "guts"
          lto: ${{ inputs.lto }}

  Upload2Release:
    name: Upload Artifacs to Release
    needs:
      - build_oneui8
      - build_oneui8-5
    if: |
      inputs.release_type != 'actions' &&
      always() &&
      (needs.build_oneui8.result == 'success' || needs.build_oneui8.result == 'skipped') &&
      (needs.build_oneui8-5.result == 'success' || needs.build_oneui8-5.result == 'skipped')
    
    env:
      GH_TOKEN: ${{ github.token }}
      
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Publish Artifacts to Release
        uses: ./.github/actions/Artifacts2release
        with:
          prerelease: ${{ inputs.release_type == 'prerelease' }}

          # Release Details
          release_name: "GutsKernel for A356E"
          release_tag: "v1.0.${{ github.run_number }}"
          release_body: |
            ## These files are essentially stock, with no modifications.

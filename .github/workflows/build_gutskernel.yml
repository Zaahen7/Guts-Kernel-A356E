# Workflow made by @Zaahen7
name: Build GutsKernel for A356E
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
        skip-build:
          description: "Skip kernel compilation and use test Image"
          required: true
          type: boolean
          default: true
          
        release_type:
            description: "Release type"
            required: true
            type: choice
            options:
              - Actions
              - Prerelease
              - Release
            default: Actions
      
        oneui_version:
          description: "One UI Version"
          required: true
          type: choice
          options:
            - 8.5
            - 8
          default: "8.5"
  
    # Kernel Modifications
        LinkTO:
          description: "Link Time Optimization(LTO) Mode"
          required: true
          type: choice
          options:
            - Default
            - Thin
            - Full
          default: Full

        kernel_variant:
          description: "Choose Kernel Variant"
          required: true
          type: choice
          options:
            - Puck
            - Zodd
            - Femto
            - Griff
            - All
          default: All

concurrency:
    group: build-kernels-${{ github.ref }}
    cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-kernel:
    name: GutsKernel One UI ${{ inputs.oneui_version }}
    runs-on: ubuntu-latest

    env:
      KERNEL_DIR: ${{ github.workspace }}/GutsKernel
      TOOLCHAIN_DIR: ${{ github.workspace }}/Toolchain
      ANYKERNEL3_DIR: ${{ github.workspace }}/Anykernel3
      ONEUI_VERSION: ${{ inputs.oneui_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare to build
        uses: ./.github/actions/1-build-setup
        with:
          repos_token: ${{ secrets.REPOS_TOKEN }}
          branch: oneui$ONEUI_VERSION
          free_diskspace: true

      - name: Setup Swap Memory
        uses: ./.github/actions/2-SetupSwapMemory
        with:
          LinkTO: ${{ inputs.LinkTO }}

      - name: Apply Kernel Modifications
        uses: ./.github/actions/3-ModifyKernel
        with:
          LinkTO: ${{ inputs.LinkTO }}
          ksu_variant: ${{ inputs.ksu_variant }}

      - name: Build Kernel
        uses: ./.github/actions/build-kernel
        with:
          LinkTO: ${{ inputs.LinkTO }}

      - name: Upload files to artifacts
        uses: ./.github/actions/UploadArtifacts
        with:
          oneui_version: ${{ env.ONEUI_VERSION }}
          kernel_build: "stock"

          #Modifications
          LinkTO: ${{ inputs.LinkTO }}

  Upload2Release:
    name: Upload Artifacs to Release
    needs: build
    if: |
      inputs.release_type != 'actions' &&
      needs.build.result == 'success'
    
    env:
      GH_TOKEN: ${{ github.token }}
      
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Publish Artifacts to Release
        uses: ./.github/actions/Artifacts2release
        with:
          prerelease: ${{ inputs.release_type == 'prerelease' }}

          # Release Details
          release_name: "GutsKernel for A356E"
          release_tag: "v1.0.${{ github.run_number }}"
          release_body: |
            ## These files are essentially stock, with no modifications.

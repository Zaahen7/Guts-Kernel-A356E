# Run this to get unmodified Image file
name: Build Raw Kernel

permissions:
  contents: write
  actions: write
  
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Select the release type"
        required: true
        type: choice
        options:
          - actions
          - prerelease
          - release
        default: actions

      oneui_version:
        description: "Select the One UI target to build"
        required: true
        type: choice
        options:
          - oneui8
          - oneui8.5
          - all
        default: all
        
      output:
        description: "Select the output files"
        required: true
        type: choice
        options:
          - Image
          - flashable-zip
          - both
        default: both

concurrency:
    group: build-kernels-${{ github.ref }}
    cancel-in-progress: false

defaults:
  run:
    shell: bash
    
jobs:
  # ============================================================
  # ONE UI 8
  # ============================================================
  build-oneui8:
    if: inputs.oneui_version == 'oneui8' || inputs.oneui_version == 'all'
    runs-on: ubuntu-latest

    env:
      KERNEL_DIR: ${{ github.workspace }}/A356E-Kernel
      TOOLCHAIN_DIR: ${{ github.workspace }}/A356E-toolchain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Prepare to build
        uses: ./.github/actions/build-setup
        with:
          repos_token: ${{ secrets.REPOS_TOKEN }}
          branch: oneui8
          
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libyaml-dev
                
      - name: Build kernel
        run: |
          cd "$KERNEL_DIR"
          chmod +x build_kernel.sh
          ./build_kernel.sh
          
  # ============================================================
  # ONE UI 8.5
  # ============================================================
  build-oneui85:
    needs: build-oneui8
    if: |
      always() &&
      (
        inputs.oneui_version == 'oneui8.5' ||
        inputs.oneui_version == 'all'
      ) &&
      (
        needs.build-oneui8.result == 'success' ||
        needs.build-oneui8.result == 'skipped'
      )
    runs-on: ubuntu-latest

    env:
      KERNEL_DIR: ${{ github.workspace }}/A356E-Kernel
      TOOLCHAIN_DIR: ${{ github.workspace }}/A356E-toolchain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Prepare to build
        uses: ./.github/actions/build-setup
        with:
          repos_token: ${{ secrets.REPOS_TOKEN }}
          branch: oneui8.5

      - name: Install dependencies
        env:
            DEBIAN_FRONTEND: noninteractive
        run: |
            echo "📦 Updating package lists..."
            sudo apt-get update -qq

            echo "📦 Installing build dependencies..."
            sudo apt-get install -y -qq \
              git device-tree-compiler lz4 xz-utils zlib1g-dev openjdk-17-jdk gcc g++ python3 python-is-python3 \
              p7zip-full android-sdk-libsparse-utils erofs-utils default-jdk gnupg flex bison gperf build-essential \
              zip curl libc6-dev libncurses-dev libx11-dev libreadline-dev libgl1 libgl1-mesa-dev bc grep tofrodos \
              python3-markdown libxml2-utils xsltproc libtinfo6 make repo cpio kmod openssl libelf-dev pahole \
              libssl-dev libarchive-tools zstd rsync --fix-missing

            echo "📦 Installing libtinfo5 (legacy ncurses compatibility)..."
            wget -q https://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.2_amd64.deb
            sudo dpkg -i libtinfo5_6.3-2ubuntu0.2_amd64.deb
            rm libtinfo5_6.3-2ubuntu0.2_amd64.deb

            echo "✅ All dependencies installed successfully"
          
      - name: Build kernel
        run: |
          cd "$KERNEL_DIR"
          chmod +x build_kernel.sh
          ./build_kernel.sh

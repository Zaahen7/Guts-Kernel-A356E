# Run this to get unmodified Image file
name: Build Raw Kernel

permissions:
  contents: write
  actions: write
  
on:
  workflow_dispatch:
    inputs:
      skip-build:
        description: "Skip kernel compilation and use test Image"
        required: true
        type: boolean
        default: false
  
      release_type:
        description: "Select the release type"
        required: true
        type: choice
        options:
          - actions
          - prerelease
          - release
        default: actions

      oneui_version:
        description: "Select the One UI target to build"
        required: true
        type: choice
        options:
          - oneui8
          - oneui8.5
          - all
        default: all
        
      output:
        description: "Select the output files"
        required: true
        type: choice
        options:
          - image
          - flashable-zip
          - both
        default: both

concurrency:
    group: build-kernels-${{ github.ref }}
    cancel-in-progress: false

defaults:
  run:
    shell: bash
    
jobs:
  # ============================================================
  # ONE UI 8
  # ============================================================
  build_oneui8:
    if: inputs.oneui_version == 'oneui8' || inputs.oneui_version == 'all'
    runs-on: ubuntu-latest

    env:
      KERNEL_DIR: ${{ github.workspace }}/A356E-Kernel
      TOOLCHAIN_DIR: ${{ github.workspace }}/A356E-toolchain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Prepare to build
        uses: ./.github/actions/build-setup
        with:
          repos_token: ${{ secrets.REPOS_TOKEN }}
          branch: oneui8
          
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt-get install -y libyaml-dev
          
      - name: Build kernel
        run: |
          cd "$KERNEL_DIR"
          chmod +x build_kernel.sh
          ./build_kernel.sh


          
      - name: Luego
        run: |
          echo "After:"
          echo "KERNEL_DIR=$KERNEL_DIR"
          echo "TOOLCHAIN_DIR=$TOOLCHAIN_DIR"
          
  # ============================================================
  # ONE UI 8.5
  # ============================================================
  build_oneui8-5:
    needs: build_oneui8
    if: |
      always() &&
      (inputs.oneui_version == 'oneui8.5' || inputs.oneui_version == 'all') &&
      (needs.build_oneui8.result == 'success' || needs.build_oneui8.result == 'skipped')
    runs-on: ubuntu-latest

    env:
      KERNEL_DIR: ${{ github.workspace }}/A356E-Kernel
      TOOLCHAIN_DIR: ${{ github.workspace }}/A356E-toolchain
      ANYKERNEL3_DIR: ${{ github.workspace }}/A356E-Anykernel3
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Prepare to build
        uses: ./.github/actions/build-setup
        with:
          repos_token: ${{ secrets.REPOS_TOKEN }}
          branch: oneui8.5
          output-files: ${{ inputs.output }}
                
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt-get install -y libyaml-dev
          
      - name: Build kernel
        if: ${{ !inputs.skip-build }}
        uses: ./.github/actions/build-kernel
        
      - name: Download existing Raw Image
        if: inputs.skip-build
        run: |
          mkdir -p "$KERNEL_DIR/arch/arm64/boot"
          wget -O Image.zip \
            "https://download1349.mediafire.com/0uee2odpec6gHN1gXXEgT6rrRhhH7IoSwt9nDj9-C6TPL77_5nyP1VDI5cfjeenHGdq3MQ4lAk0PfPhAow7ZYyMnIIwT88MY8LOeqlhw257itqNvT_CJDlgnDdtpXMkHF3dlo52P5Whl-yZ4OBIF-sxuvpTm3qZXZ0eZ2Sfa4mIJTQ/7z7woq4o9es4huj/Image.zip"
          unzip -o Image.zip -d image-temp
          find image-temp -type f -print
          cp "$(find image-temp -type f -name 'Image' -print -quit)" \
            "$KERNEL_DIR/arch/arm64/boot/Image"
            
      - name: Publish files as ${{ inputs.release_type }}
        uses: ./.github/actions/PublishFiles
        with:
          release_type: ${{ inputs.release_type }}
          
      - name: Export Artifacts to github
        uses: ./.github/actions/export-artifacts
        with:
          output-files: ${{ inputs.output }}
          oneui-version: ${{ inputs.oneui_version }}

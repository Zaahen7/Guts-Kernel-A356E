# Run this to get unmodified Image file
name: Build Raw Kernel

permissions:
  contents: write
  actions: write
  
on:
  workflow_dispatch:
    inputs:
      skip-build:
        description: "Skip kernel compilation and use test Image"
        required: true
        type: boolean
        default: true
  
      release_type:
        description: "Select the release type"
        required: true
        type: choice
        options:
          - actions
          - prerelease
          - release
        default: actions

      oneui_version:
        description: "Select the One UI target to build"
        required: true
        type: choice
        options:
          - oneui8
          - oneui8.5
          - all
        default: all
        
      output_files:
        description: "Select the output files"
        required: true
        type: choice
        options:
          - image
          - flashable-zip
          - both
        default: both

concurrency:
    group: build-kernels-${{ github.ref }}
    cancel-in-progress: false

defaults:
  run:
    shell: bash
    
jobs:
  # ============================================================
  # ONE UI 8
  # ============================================================
  build_oneui8:
    if: inputs.oneui_version == 'oneui8' || inputs.oneui_version == 'all'
    runs-on: ubuntu-latest

    env:
      KERNEL_DIR: ${{ github.workspace }}/A356E-Kernel
      TOOLCHAIN_DIR: ${{ github.workspace }}/A356E-toolchain
      ANYKERNEL3_DIR: ${{ github.workspace }}/A356E-Anykernel3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Prepare to build
        uses: ./.github/actions/build-setup
        with:
          repos_token: ${{ secrets.REPOS_TOKEN }}
          branch: oneui8
          output_files: ${{ inputs.output_files }}
                
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt-get install -y libyaml-dev
          
      - name: Build kernel
        if: ${{ !inputs.skip-build }}
        uses: ./.github/actions/build-kernel
        
      - name: Download existing Raw Image
        if: inputs.skip-build
        run: |
          mkdir -p "$KERNEL_DIR/arch/arm64/boot"
          wget -O Image.zip \
            "https://download1349.mediafire.com/9pa3198m0nzgfrLgZY50pc-_qIlgO99gXAFdQz4Q3-3hOh_j5uQpaTpOv061UUahz38ctqIVT2JThZTWlQ84uueobnaHGvQWk1iXANZaU9OrgAKOfrdq3xeLw8CgBN5azJmMjHi4qhXOPFuf-pBJfOk2P_7MqnWcPprvNi_N-2mplQ/7z7woq4o9es4huj/Image.zip"
          unzip -o Image.zip -d image-temp
          find image-temp -type f -print
          cp "$(find image-temp -type f -name 'Image' -print -quit)" \
            "$KERNEL_DIR/arch/arm64/boot/Image"
            
      - name: Publish files as ${{ inputs.release_type }}
        uses: ./.github/actions/PublishFiles
        with:
          release_type: ${{ inputs.release_type }}
          output_files: ${{ inputs.output_files }}
          oneui_version: ${{ inputs.oneui_version }}
          
  # ============================================================
  # ONE UI 8.5
  # ============================================================
  build_oneui8-5:
    needs: build_oneui8
    if: |
      always() &&
      (inputs.oneui_version == 'oneui8.5' || inputs.oneui_version == 'all') &&
      (needs.build_oneui8.result == 'success' || needs.build_oneui8.result == 'skipped')
    runs-on: ubuntu-latest

    env:
      KERNEL_DIR: ${{ github.workspace }}/A356E-Kernel
      TOOLCHAIN_DIR: ${{ github.workspace }}/A356E-toolchain
      ANYKERNEL3_DIR: ${{ github.workspace }}/A356E-Anykernel3
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Prepare to build
        uses: ./.github/actions/build-setup
        with:
          repos_token: ${{ secrets.REPOS_TOKEN }}
          branch: oneui8.5
          output_files: ${{ inputs.output_files }}
                
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt-get install -y libyaml-dev
          
      - name: Build kernel
        if: ${{ !inputs.skip-build }}
        uses: ./.github/actions/build-kernel
        
      - name: Download existing Raw Image
        if: inputs.skip-build
        run: |
          mkdir -p "$KERNEL_DIR/arch/arm64/boot"
          wget -O Image.zip \
            "https://download1349.mediafire.com/ibx4w4uf68pg8T_R9Aph5K_pME08z-Q-YWtwNcJVOc0V31sSt4KeS-VreGS606RUhpG3cpZt9jURDRJaG-ngEGcicTsccWId30CPazE-OgYosq2e8apd0nMNyYImT60zWNYPV7aceTlsp0F8EW03l40435T_dpHFnzw6T9oz8LXNCA/7z7woq4o9es4huj/Image.zip"
          unzip -o Image.zip -d image-temp
          find image-temp -type f -print
          cp "$(find image-temp -type f -name 'Image' -print -quit)" \
            "$KERNEL_DIR/arch/arm64/boot/Image"
            
      - name: Publish files as actions
        if: inputs.release_type == 'actions'
        uses: ./.github/actions/PublishFiles
        with:
          output_files: ${{ inputs.output_files }}
          oneui_version: ${{ inputs.oneui_version }}

      - name: Publish files as release/prerelease
        if: inputs.release_type == 'release' || inputs.release_type == 'prerelease'
        uses: ./.github/actions/PublishRelease
        with:
          prerelease: ${{ inputs.release_type == 'prerelease' }}
          output_files: ${{ inputs.output_files }}
          oneui_version: ${{ inputs.oneui_version }}

          # Release Details
          release_name: "A356E Raw Kernel/Image - One UI ${{ inputs.oneui_version }}"
          release_tag: "v1.0.${{ github.run_number }}"
          release_body: |
            ## These files are essentially stock, with no modifications.
            
            ### Build information
            - One UI: ${{ inputs.oneui_version }}
            - Build: ${{ github.run_number }}
            - Commit: ${{ github.sha }}
            
            ### Changelog
            - Initial build
          files: |
            ${{ github.workspace }}/release_files/**/*

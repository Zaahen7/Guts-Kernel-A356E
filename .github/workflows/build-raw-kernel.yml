# Run this to get unmodified Image file
name: Build Raw Kernel

permissions:
  contents: write
  actions: write
  
on:
  workflow_dispatch:
    inputs:
      skip-build:
        description: "Skip kernel compilation and use test Image"
        required: true
        type: boolean
        default: true
  
      release_type:
        description: "Select the release type"
        required: true
        type: choice
        options:
          - actions
          - prerelease
          - release
        default: actions

      oneui_version:
        description: "Select the One UI target to build"
        required: true
        type: choice
        options:
          - oneui8
          - oneui8.5
          - all
        default: all
        
      output_files:
        description: "Select the output files"
        required: true
        type: choice
        options:
          - image
          - flashable-zip
          - both
        default: both

concurrency:
    group: build-kernels-${{ github.ref }}
    cancel-in-progress: false

defaults:
  run:
    shell: bash
    
jobs:
  # ============================================================
  # ONE UI 8
  # ============================================================
  build_oneui8:
    if: inputs.oneui_version == 'oneui8' || inputs.oneui_version == 'all'
    runs-on: ubuntu-latest

    env:
      KERNEL_DIR: ${{ github.workspace }}/A356E-Kernel
      TOOLCHAIN_DIR: ${{ github.workspace }}/A356E-toolchain
      ANYKERNEL3_DIR: ${{ github.workspace }}/A356E-Anykernel3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Prepare to build
        uses: ./.github/actions/build-setup
        with:
          repos_token: ${{ secrets.REPOS_TOKEN }}
          branch: oneui8
          output_files: ${{ inputs.output_files }}
                
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt-get install -y libyaml-dev
          
      - name: Build kernel
        if: ${{ !inputs.skip-build }}
        uses: ./.github/actions/build-kernel
        
      - name: Create dummy Raw Image
        if: inputs.skip-build
        shell: bash
        run: |
          mkdir -p "$KERNEL_DIR/arch/arm64/boot"
          echo "DUMMY KERNEL IMAGE FOR PIPELINE TEST" > "$KERNEL_DIR/arch/arm64/boot/Image"
          ls -lh "$KERNEL_DIR/arch/arm64/boot/Image"
            
      - name: Publish files as actions
        if: inputs.release_type == 'actions'
        uses: ./.github/actions/PublishActions
        with:
          output_files: ${{ inputs.output_files }}
          oneui_version: ${{ inputs.oneui_version }}

      - name: Publish files as release/prerelease
        if: inputs.release_type == 'release' || inputs.release_type == 'prerelease'
        uses: ./.github/actions/PublishRelease
        with:
          prerelease: ${{ inputs.release_type == 'prerelease' }}
          output_files: ${{ inputs.output_files }}
          oneui_version: ${{ inputs.oneui_version }}

          # Release Details
          release_name: "A356E Raw Kernel/Image - One UI 8"
          release_tag: "v1.0.${{ github.run_number }}"
          release_body: |
            ## These files are essentially stock, with no modifications.
            
  # ============================================================
  # ONE UI 8.5
  # ============================================================
  build_oneui8-5:
    needs: build_oneui8
    if: |
      always() &&
      (inputs.oneui_version == 'oneui8.5' || inputs.oneui_version == 'all') &&
      (needs.build_oneui8.result == 'success' || needs.build_oneui8.result == 'skipped')
    runs-on: ubuntu-latest

    env:
      KERNEL_DIR: ${{ github.workspace }}/A356E-Kernel
      TOOLCHAIN_DIR: ${{ github.workspace }}/A356E-toolchain
      ANYKERNEL3_DIR: ${{ github.workspace }}/A356E-Anykernel3
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Prepare to build
        uses: ./.github/actions/build-setup
        with:
          repos_token: ${{ secrets.REPOS_TOKEN }}
          branch: oneui8.5
          output_files: ${{ inputs.output_files }}
                
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt-get install -y libyaml-dev
          
      - name: Build kernel
        if: ${{ !inputs.skip-build }}
        uses: ./.github/actions/build-kernel
        
      - name: Create dummy Raw Image
        if: inputs.skip-build
        shell: bash
        run: |
          mkdir -p "$KERNEL_DIR/arch/arm64/boot"
          echo "DUMMY KERNEL IMAGE FOR PIPELINE TEST" > "$KERNEL_DIR/arch/arm64/boot/Image"
          ls -lh "$KERNEL_DIR/arch/arm64/boot/Image"
            
      - name: Publish files as actions
        if: inputs.release_type == 'actions'
        uses: ./.github/actions/PublishActions
        with:
          output_files: ${{ inputs.output_files }}
          oneui_version: ${{ inputs.oneui_version }}

      - name: Publish files as release/prerelease
        if: inputs.release_type == 'release' || inputs.release_type == 'prerelease'
        uses: ./.github/actions/PublishRelease
        with:
          prerelease: ${{ inputs.release_type == 'prerelease' }}
          output_files: ${{ inputs.output_files }}
          oneui_version: ${{ inputs.oneui_version }}

          # Release Details
          release_name: "A356E Raw Kernel/Image - One UI 8.5"
          release_tag: "v1.0.${{ github.run_number }}"
          release_body: |
            ## These files are essentially stock, with no modifications.

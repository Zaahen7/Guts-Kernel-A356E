name: Build Kernel

permissions:
  contents: write
  actions: write
  
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Select the release type"
        required: true
        type: choice
        options:
          - actions
          - prerelease
          - release
        default: actions

      lto:
        description: "Choose LTO build"
        required: true
        type: choice
        options:
          - default
          - thin
          - full
        default: default
        
      ksu_variant:
        description: "Select Kernel SU variant"
        required: true
        type: choice
        options:
          - none
          - ksu
          - ksu-next
          - all
        default: all

      oneui_version:
        description: "Select the One UI target to build"
        required: true
        type: choice
        options:
          - oneui8
          - oneui8.5
          - all
        default: all

      susfs:
        description: "SUSFS"
        required: false
        type: boolean
        default: true

concurrency:
    group: build-kernels-${{ github.ref }}
    cancel-in-progress: false

defaults:
  run:
    shell: bash
    
jobs:
  # build:
    # runs-on: ubuntu-latest

    # steps:
#      - name: Free Disk Space
#        uses: endersonmenezes/free-disk-space@v3
#        with:
#          remove_android: true
#          remove_dotnet: true
#          remove_haskell: true
#          remove_tool_cache: true
#          remove_swap: true
#


  # ============================================================
  # ONE UI 8
  # ============================================================
  build-oneui8:
    if: inputs.oneui_version == 'oneui8' || inputs.oneui_version == 'all'
    uses: ./.github/workflows/build.yml
    secrets: inherit

    with:
      branch: oneui8
      ksu_variant: ${{ inputs.ksu_variant }}
      susfs: ${{ inputs.susfs }}
      lto: ${{ inputs.lto }}

  # ============================================================
  # ONE UI 8.5
  # ============================================================
  build-oneui85:
    needs: build-oneui8
    if: |
      always() &&
      (
        inputs.oneui_version == 'oneui8.5' ||
        inputs.oneui_version == 'all'
      ) &&
      (
        needs.build-oneui8.result == 'success' ||
        needs.build-oneui8.result == 'skipped'
      )

    uses: ./.github/workflows/build.yml
    secrets: inherit

    with:
      branch: oneui8.5
      ksu_variant: ${{ inputs.ksu_variant }}
      susfs: ${{ inputs.susfs }}
      lto: ${{ inputs.lto }}

      

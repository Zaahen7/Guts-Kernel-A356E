name: Build Kernel

permissions:
  contents: write
  actions: write
  
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Select the release type"
        required: true
        type: choice
        options:
          - actions
          - prerelease
          - release
        default: actions


      kernel_variant:
        description: "Select GUTS KERNEL variant"
        required: true
        type: choice
        options:
          - none
          - ksu-next
          - all
        default: ksu-next

      susfs:
        description: "SUSFS"
        required: false
        type: boolean
        default: true

concurrency:
    group: build-kernels-${{ github.ref }}
    cancel-in-progress: false

defaults:
  run:
    shell: bash
    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
#      - name: Free Disk Space
#        uses: endersonmenezes/free-disk-space@v3
#        with:
      - name: Check Disk Space
        run: |
          echo "=== Disk Space ==="
          df -h

          echo
          echo "=== Root Filesystem ==="
          df -h /

          echo
          echo "=== Disk Usage ==="
          du -sh /home/runner/* 2>/dev/null | sort -h | tail -20

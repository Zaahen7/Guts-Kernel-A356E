name: Build Kernel

permissions:
  contents: write
  actions: write
  
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Select the release type"
        required: true
        type: choice
        options:
          - actions
          - prerelease
          - release
        default: actions


      kernel_variant:
        description: "Select GUTS KERNEL variant"
        required: true
        type: choice
        options:
          - none
          - ksu-next
          - all
        default: ksu-next

      susfs:
        description: "SUSFS"
        required: false
        type: boolean
        default: true

concurrency:
    group: build-kernels-${{ github.ref }}
    cancel-in-progress: false

defaults:
  run:
    shell: bash
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # - name: Free Disk Space
      #   uses: endersonmenezes/free-disk-space@v3
      #   with:

      - name: Check Disk Space
        run: |
          echo "=== Disk Space ==="
          df -h

          echo
          echo "=== Root Filesystem ==="
          df -h /
          
      - name: Check Disk Usage
        run: |
          echo "=== Disk Space ==="
          df -h /
      
          echo
          echo "=== /usr ==="
          sudo du -sh /usr
      
          echo
          echo "=== /opt ==="
          sudo du -sh /opt
      
          echo
          echo "=== /home ==="
          sudo du -sh /home
      
          echo
          echo "=== /tmp ==="
          sudo du -sh /tmp

          sudo du -xhd1 /tmp 2>/dev/null | sort -h


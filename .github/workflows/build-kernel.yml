name: Build Kernel

permissions:
  contents: write
  actions: write
  
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Select the release type"
        required: true
        type: choice
        options:
          - actions
          - prerelease
          - release
        default: actions


      kernel_variant:
        description: "Select Kernel SU variant"
        required: true
        type: choice
        options:
          - none
          - ksu
          - ksu-next
          - all
        default: all

      oneui_version:
        description: "Select the One UI target to build"
        required: true
        type: choice
        options:
          - oneui8
          - oneui8.5
          - all
        default: all

      susfs:
        description: "SUSFS"
        required: false
        type: boolean
        default: true

concurrency:
    group: build-kernels-${{ github.ref }}
    cancel-in-progress: false

defaults:
  run:
    shell: bash
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
#      - name: Free Disk Space
#        uses: endersonmenezes/free-disk-space@v3
#        with:
#          remove_android: true
#          remove_dotnet: true
#          remove_haskell: true
#          remove_tool_cache: true
#          remove_swap: true
#
      - name: Clone kernel source
        run: |
          git clone --depth 1 -b oneui8 --single-branch https://github.com/Zaahen7/A356E-KernelSources.git $CONFIG

name: Export files
description: Export kernel files

inputs:
  kernel-variant:
    required: false

runs:
  using: composite
  steps:
    - name: Copy Image file to AnyKernel3
      shell: bash
      run: cp "$KERNEL_DIR/arch/arm64/boot/Image" "$ANYKERNEL3_DIR"

    - name: Upload Kernel in Actions
      uses: actions/upload-artifact@v4
      with:
        name: GutsKernel-${{ env['DEVICE_MODEL'] }}-${{ inputs['kernel-variant'] }}${{ env['${{ inputs.kernel-variant }}_VERSION'] }}-Oneui${{ env['ONEUI_VERSION'] }}-${{ env['BUILD_DATE'] }}
        path: ${{ env['ANYKERNEL3_DIR'] }}
        compression-level: 9

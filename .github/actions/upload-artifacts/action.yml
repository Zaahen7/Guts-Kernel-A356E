name: Export files
description: Export kernel files

inputs:
  variant:
    required: false

runs:
  using: composite
  steps:
    - name: Copy Image file to AnyKernel3
      shell: bash
      run: cp "$KERNEL_DIR/arch/arm64/boot/Image" "$ANYKERNEL3_DIR"

    - name: Export metadata
      id: meta
      shell: bash
      run: |
        BUILD_DATE=$(date +'%Y%m%d')
        echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
        echo "oneui_version=$ONEUI_VERSION" >> "$GITHUB_OUTPUT"
        echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

    - name: Upload Kernel in Actions
      uses: actions/upload-artifact@v4
      with:
        name: GutsKernel${{ inputs.variant }}-A356E-Oneui${{ env.ONEUI_VERSION }}-${{ env.BUILD_DATE }}
        path: ${{ env.ANYKERNEL3_DIR }}
        compression-level: 9

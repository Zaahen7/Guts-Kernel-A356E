name: Export artifacts
description: Export kernel artifacts

inputs:
  output-files:
    required: true
  oneui-version:
    required: true

runs:
  using: composite
  steps:
    - name: Export Image file
      if: inputs.output-files == 'image' || inputs.output-files == 'both'
      uses: actions/upload-artifact@v4
      with:
        name: RawImage
        path: ${{ env.KERNEL_DIR }}/arch/arm64/boot/Image

    - name: Export flashable zip
      if: inputs.output-files == 'flashable-zip' || inputs.output-files == 'both'
      uses: actions/upload-artifact@v4
      with:
        name: RawKernel-A356E-${{ inputs.oneui-version }}
        path: ${{ env.ANYKERNEL3_DIR }}

name: Export files
description: Export kernel files

inputs:
  output_files:
    required: true
  oneui_version:
    required: true
  kernel_build:
    required: true

runs:
  using: composite
  steps:
    - name: Set stock files name
      if: inputs.kernel_build == 'stock'
      shell: bash
      run: |
        if [ "${{ inputs.output_files }}" == "image" ] || [ "${{ inputs.output_files }}" == "both" ]; then
          IMAGE_ZIPNAME="StockImage_A356E_oneui${{ inputs.oneui_version }}"
          echo "IMAGE_ZIPNAME=$IMAGE_ZIPNAME" >> "$GITHUB_ENV"
        fi
        
        if [ "${{ inputs.output_files }}" == "flashable-zip" ] || [ "${{ inputs.output_files }}" == "both" ]; then
          KERNEL_ZIPNAME="StockFlashableKernel_A356E_oneui${{ inputs.oneui_version }}"
          echo "KERNEL_ZIPNAME=$KERNEL_ZIPNAME" >> "$GITHUB_ENV"
        fi

    - name: Set GutsKernel files name
      if: inputs.kernel_build == 'guts'
      shell: bash
      run: |
        if [ "${{ inputs.output_files }}" == "flashable-zip" ] || [ "${{ inputs.output_files }}" == "both" ]; then
          KERNEL_ZIPNAME="GutsKernel-A356E-oneui${{ inputs.oneui_version }}"
          echo "KERNEL_ZIPNAME=$KERNEL_ZIPNAME" >> "$GITHUB_ENV"
        fi
      
    - name: Upload Image in Actions
      if: inputs.kernel_build == 'stock' && (inputs.output_files == 'image' || inputs.output_files == 'both')
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.IMAGE_ZIPNAME }}
        path: ${{ env.KERNEL_DIR }}/arch/arm64/boot/Image
        compression-level: 9
        
    - name: Copy Image file to Anykernel3
      if: inputs.output_files == 'flashable-zip' || inputs.output_files == 'both'
      shell: bash
      run: |
        cp "$KERNEL_DIR/arch/arm64/boot/Image" "$ANYKERNEL3_DIR"
        
    - name: Upload Kernel in Actions
      if: inputs.output_files == 'flashable-zip' || inputs.output_files == 'both'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.KERNEL_ZIPNAME }}
        path: ${{ env.ANYKERNEL3_DIR }}
        compression-level: 9

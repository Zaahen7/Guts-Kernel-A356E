name: Export files
description: Export kernel files

inputs:
      oneui_version:
        required: true

      kernel_build:
        required: true

  # Kernel Modifications
      LinkTO:
        required: false

runs:
  using: composite
  steps:
    - name: Set files name
      shell: bash
      run: |
        if [[ "${{ inputs.kernel_build }}" == "stock" ]]; then
          KERNEL_ZIPNAME="StockFlashableKernel_A356E_Oneui${{ inputs.oneui_version }}"
        elif [[ "${{ inputs.kernel_build }}" == "guts" ]]; then
          KERNEL_ZIPNAME="GutsKernel_A356E_Oneui${{ inputs.oneui_version }}"
        else
          echo "ERROR: Unknown kernel build: ${{ inputs.kernel_build }}"
          exit 1
        fi

        echo "KERNEL_ZIPNAME=$KERNEL_ZIPNAME" >> "$GITHUB_ENV"

    - name: Append modifications to kernel zipname
      shell: bash
      run: |
        if [[ -n "${{ inputs.LinkTO }}" ]]; then
            KERNEL_ZIPNAME="${KERNEL_ZIPNAME}_${{ inputs.LinkTO }}LTO"
        fi
        
        echo "KERNEL_ZIPNAME=$KERNEL_ZIPNAME" >> "$GITHUB_ENV"

    - name: Copy Image file to AnyKernel3
      shell: bash
      run: |
        cp "$KERNEL_DIR/arch/arm64/boot/Image" "$ANYKERNEL3_DIR"

    - name: Upload Kernel in Actions
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.KERNEL_ZIPNAME }}
        path: ${{ env.ANYKERNEL3_DIR }}
        compression-level: 9

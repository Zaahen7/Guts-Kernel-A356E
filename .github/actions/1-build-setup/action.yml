name: Prepare to build kernel
description: Create directories and clone repos that will be used

inputs:
    repos_token:
        description: "Repository access token"
        required: true
        
    free_diskspace:
        description: "Enable to free disk space"
        required: true

runs:
  using: composite
  steps:
    - name: Configure Git authentication
      env:
        REPOS_TOKEN: ${{ inputs.repos_token }}
      shell: bash
      run: |
        git config --global url."https://x-access-token:${REPOS_TOKEN}@github.com/".insteadOf "https://github.com/"

    - name: Free disk space
      if: ${{ inputs.free_diskspace }}
      uses: endersonmenezes/free-disk-space@v3
      with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true

    - name: Install dependencies
      shell: bash
      run: |
        echo "Installing dependencies..."
        sudo apt update
        sudo apt-get install -y libyaml-dev
        echo "Done :v"

    - name: Setup Swap Memory
      shell: bash
      run: |
        SWAPFILE="/swapfile"

        case "${{ inputs.LinkTO }}" in
          Full)
            SWAP_SIZE="25G"
            ;;
          Thin)
            SWAP_SIZE="12G"
            ;;
          Default)
            SWAP_SIZE="8G"
            ;;
          *)
            echo "Error: Unknown LTO mode: ${{ inputs.LinkTO }}"
            exit 1
            ;;
        esac

        echo "Memory and swap before:"
        free -h

        echo "Setting up $SWAP_SIZE swap..."

        if swapon --show=NAME | grep -q "^${SWAPFILE}$"; then
          echo "Swap already enabled."
        else
          sudo fallocate -l "$SWAP_SIZE" "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
        fi

        echo "Memory and swap after:"
        free -h
        
    - name: Prepare directories
      shell: bash
      run: |
        echo "Preparing directories..."
        rm -rf "$KERNEL_DIR" "$TOOLCHAIN_DIR" "$ANYKERNEL3_DIR"
        mkdir "$KERNEL_DIR" "$TOOLCHAIN_DIR" "$ANYKERNEL3_DIR"
        echo "Done :v"
        
    - name: Clone kernel source
      shell: bash
      env:
        SOURCE: "https://github.com/Zaahen7/A356E-KernelSources.git"
        BRANCH: "oneui8.5"
        DIRECTORY: "$KERNEL_DIR"
      run: |
        echo "Cloning Kernel Source..."
        git clone \
            --depth 1 \
            --single-branch \
            --branch "$BRANCH" \
            "$SOURCE" \
            "$DIRECTORY"
        echo "Done :v"
        
    - name: Clone Toolchain
      shell: bash
      env:
        SOURCE: "https://github.com/Zaahen7/A356E-toolchain.git"
        BRANCH: "main"
        DIRECTORY: "$TOOLCHAIN_DIR"
      run: |
        echo "Cloning Toolchain..."
        git clone \
            --depth 1 \
            --single-branch \
            --branch "$BRANCH" \
            "$SOURCE" \
            "$DIRECTORY"
        echo "Done :v"

    - name: Setup Toolchain
      shell: bash
      run: |
        echo "Toolchain Setup..."
        for archive in "$TOOLCHAIN_DIR"/*.tar.xz; do
          echo "Extracting: $(basename "$archive")"
          tar -xJf "$archive" -C "$TOOLCHAIN_DIR"
          rm -f "$archive"
        done
        mv "$TOOLCHAIN_DIR/toolchain" "$KERNEL_DIR"
        echo "Done :v"

    - name: Clone Anykernel3
      shell: bash
      env:
        SOURCE: "https://github.com/Zaahen7/AK3.git"
        BRANCH: "main"
        DIRECTORY: "$ANYKERNEL3_DIR"
      run: |
        echo "Cloning Anykernel3..."
        git clone \
            --depth 1 \
            --single-branch \
            --branch "$BRANCH" \
            "$SOURCE" \
            "$DIRECTORY"
        echo "Done :v"
      
    - name: Extract kernel version from MAKEFILE
      shell: bash
      run: |
        KERNEL_VERSION=$(make -s -C "$KERNEL_DIR" kernelversion)
        echo "Kernel version: $KERNEL_VERSION"
        echo "KERNEL_VERSION=$KERNEL_VERSION" >> "$GITHUB_ENV"
    
    - name: Edit update-binary from Anykernel3
      shell: bash
      run: |
        echo "Editing update-binary..."
        sed -i "s/Zaahen7/$ONEUI_VERSION/g" "$ANYKERNEL3_DIR/META-INF/com/google/android/update-binary"
        sed -i "s/7nehaaZ/$KERNEL_VERSION/g" "$ANYKERNEL3_DIR/META-INF/com/google/android/update-binary"
        echo "Done :v"
        

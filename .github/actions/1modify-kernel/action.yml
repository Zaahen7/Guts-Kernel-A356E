name: Apply kernel Modifications
description: Apply kernel mods
inputs:
  LinkTO:
    required: true
  ksu_variant:
    required: true
  ksun_branch:
    required: false
    default: stable

runs:
  using: composite
  steps:
    - name: Set LTO Mode
      shell: bash
      run: |
        echo "===== LTO CONFIGURATION ====="
        echo "LTO mode: ${{ inputs.LinkTO }}"
        echo "Defconfig: $A35_DEFCONFIG"
        
        if [[ "${{ inputs.LinkTO }}" == "full" ]]; then
          echo "Enabling Full LTO..."
        
          "$KERNEL_DIR/scripts/config" \
            --file "$A35_DEFCONFIG" \
            --enable CONFIG_LTO_CLANG \
            --disable CONFIG_LTO_NONE \
            --disable CONFIG_LTO_CLANG_THIN \
            --enable CONFIG_LTO_CLANG_FULL
        
        elif [[ "${{ inputs.LinkTO }}" == "thin" ]]; then
          echo "Enabling Thin LTO..."
        
          "$KERNEL_DIR/scripts/config" \
            --file "$A35_DEFCONFIG" \
            --enable CONFIG_LTO_CLANG \
            --disable CONFIG_LTO_NONE \
            --disable CONFIG_LTO_CLANG_FULL \
            --enable CONFIG_LTO_CLANG_THIN
        
        else
          echo "LTO is default, no changes to defconfig"
        fi
        
        echo "===== LTO CONFIG RESULT ====="
        grep -E 'CONFIG_(LTO|LTO_CLANG)' "$A35_DEFCONFIG" || true
        echo "============================="
        
    - name: Add Kernel SU Next
      if: inputs.ksu_variant == 'ksu-next'
      shell: bash
      run: |
        set -euo pipefail

        echo "===== KERNELSU-NEXT CONFIGURATION ====="
        echo "Kernel directory: $KERNEL_DIR"
        echo "Kernel version: ${KERNEL_VERSION:-unknown}"
        echo "Defconfig: $A35_DEFCONFIG"
        echo "KernelSU-Next branch: ${{ inputs.ksun_branch }}"

        cd "$KERNEL_DIR"

        # Install KernelSU-Next
        if [[ "${{ inputs.ksun_branch }}" == "dev" ]]; then
          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s dev
        else
          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s "${{ inputs.ksun_branch }}"
        fi

        echo "===== KERNELSU-NEXT INSTALLED ====="

        # Enable KernelSU in A356E defconfig
        "$KERNEL_DIR/scripts/config" \
          --file "$A35_DEFCONFIG" \
          --enable CONFIG_KSU

        # KPROBES hook disabled for Samsung 5.15
        "$KERNEL_DIR/scripts/config" \
          --file "$A35_DEFCONFIG" \
          --disable CONFIG_KSU_KPROBES_HOOK

        echo "===== KERNELSU CONFIGURATION ====="
        grep -E '^CONFIG_KSU' "$A35_DEFCONFIG" || true

        # Verify installation
        if [[ ! -d "$KERNEL_DIR/KernelSU-Next" ]]; then
          echo "ERROR: KernelSU-Next was not installed"
          exit 1
        fi

        if [[ ! -L "$KERNEL_DIR/drivers/kernelsu" ]]; then
          echo "ERROR: drivers/kernelsu symlink was not created"
          exit 1
        fi

        echo "KernelSU-Next installed successfully."
        echo "KSU path: $KERNEL_DIR/KernelSU-Next"
        echo "KSU link: $(readlink "$KERNEL_DIR/drivers/kernelsu")"
        echo "====================================="

name: Modify Kernel
description: Modify Kernel

inputs:
  disable-securities:
    description: "Disable Samsung Securities"
  kernel-variant:
    description: "Kernel variant"
  enable-susfs:
    description: "Enable SUSFS"
  apply-kpatches:
    description: "Apply optimization patches"
  enable-bbg:
    description: "Enable Baseband Guard"
  enable-netsch:
    description: "Enable more NET schedulers"
  enable-bbrv3:
    description: "Enable BBR & BBRv3"
  extended-tmpfs:
    description: "Enable extended TMPFS support for meta modules and Mountify"
  vfs-support:
    description: "Add VFS support for selected MetaModule"
  battery-tweak:
    description: "EXPERIMENTAL battery tweak"
    
runs:
  using: composite
  steps:
    - name: Disable Defconfig Check
      shell: bash
      run: |
        if sed -i 's/check_defconfig//' "$KERNEL_DIR/build.config.gki"; then
          echo "✅ Disabled"
        else
          echo "❌ Failed to modify build.config.gki"
          exit 1
        fi

    - name: Disable Samsung security features
      if: ${{ inputs['disable-securities'] == 'true' }}
      shell: bash
      run: |
        for config in \
          CONFIG_UH \
          CONFIG_UH_RKP \
          CONFIG_UH_LKMAUTH \
          CONFIG_UH_LKM_BLOCK \
          CONFIG_RKP \
          CONFIG_RKP_CFP \
          CONFIG_RKP_CFP_JOPP \
          CONFIG_RKP_CFP_ROPP \
          CONFIG_KDP \
          CONFIG_KDP_NS \
          CONFIG_SECURITY_DEFEX \
          CONFIG_FIVE \
          CONFIG_PROCA
        do
          if "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --disable "$config"; then
            echo "✅ Disabled $config"
          else
            echo "❌ Failed: $config"
            exit 1
          fi
        done
        
    - name: Install ${{ inputs['kernel-variant'] }}
      if: ${{ inputs['kernel-variant'] != 'CLEAN' }}
      shell: bash
      env:
        KSU_REPO: "https://github.com/tiann/KernelSU"
        KSUN_REPO: "https://github.com/KernelSU-Next/KernelSU-Next"
        KSUN_SUSFS_REPO: "https://github.com/pershoot/KernelSU-Next"
        BAKASU_REPO: "https://github.com/Baka-SU/BakaSU"
        FINASU_REPO: "https://github.com/LyraVoid/FinaSU"
      run: | 
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/latest-commit-hash.sh" # loads latest_commit function
        
        cd "$KERNEL_DIR"
        DRIVER_DIR="$KERNEL_DIR/drivers"
        DRIVER_MAKEFILE="$DRIVER_DIR/Makefile"
        DRIVER_KCONFIG="$DRIVER_DIR/Kconfig"
        
        case "${{ inputs['kernel-variant'] }}" in
          KSU)
            # Clone KernelSU
            if [ ! -d "$KERNEL_DIR/KernelSU" ]; then
                git clone "$KSU_REPO" "$KERNEL_DIR/KernelSU"
            fi
            cd "$KERNEL_DIR/KernelSU"
            git stash
            git pull
            
            KSU_TAG=$(git describe --abbrev=0 --tags)
            KSU_SHA=$(git rev-list -n 1 "$KSU_TAG")
            git checkout "$KSU_SHA"

            # Create drivers symbolic link
            ln -sf "$(realpath --relative-to="$DRIVER_DIR" "$KERNEL_DIR/KernelSU/kernel")" "$DRIVER_DIR/kernelsu"

            # Modify Drivers Makefile
            if ! grep -q "kernelsu" "$DRIVER_MAKEFILE"; then
                printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$DRIVER_MAKEFILE"
            fi

            # Modify Drivers Kconfig
            if ! grep -q 'source "drivers/kernelsu/Kconfig"' "$DRIVER_KCONFIG"; then
                sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' "$DRIVER_KCONFIG"
            fi

            echo "${{ inputs['kernel-variant'] }}_SHA=$KSU_SHA" >> "$GITHUB_ENV"
            echo "✅ KernelSU installed successfully."
            ;;
          KSUN)
            if [ "${{ inputs['enable-susfs'] }}" == 'true' ]; then
                KSUN_REPO_URL="$KSUN_SUSFS_REPO"
            else
                KSUN_REPO_URL="$KSUN_REPO"
            fi
        
            # Get latest commit SHA
            KSUN_SHA=$(latest_commit "$KSUN_REPO_URL" "dev") || exit 1
        
            # Clone repository
            if [ ! -d "$KERNEL_DIR/KernelSU-Next" ]; then
                git clone "$KSUN_REPO_URL" "$KERNEL_DIR/KernelSU-Next"
            fi
            
            # Update repository
            cd "$KERNEL_DIR/KernelSU-Next"
            git stash
            git fetch origin
        
            # Checkout selected commit
            git checkout "$KSUN_SHA"
        
            # Create drivers symbolic link
            ln -sf "$(realpath --relative-to="$DRIVER_DIR" "$KERNEL_DIR/KernelSU-Next/kernel")" "$DRIVER_DIR/kernelsu"
        
            # Modify Drivers Makefile
            if ! grep -q "kernelsu" "$DRIVER_MAKEFILE"; then
                printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$DRIVER_MAKEFILE"
            fi
        
            # Modify Drivers Kconfig
            if ! grep -q 'source "drivers/kernelsu/Kconfig"' "$DRIVER_KCONFIG"; then
                sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' "$DRIVER_KCONFIG"
            fi

            echo "${{ inputs['kernel-variant'] }}_SHA=$KSUN_SHA" >> "$GITHUB_ENV"
            echo "✅ KernelSU-Next installed successfully."
            ;;
          BAKASU)
            # Get latest commit SHA
            BAKASU_SHA=$(latest_commit "$BAKASU_REPO" "main") || exit 1
          
            # Clone BakaSU
            if [ ! -d "$KERNEL_DIR/KernelSU" ]; then
                git clone "$BAKASU_REPO" "$KERNEL_DIR/KernelSU"
            fi
          
            cd "$KERNEL_DIR/KernelSU"
          
            # Update repository
            git stash
            git fetch origin
          
            # Checkout selected commit
            git checkout "$BAKASU_SHA"
          
            # Create drivers symbolic link
            ln -sf "$(realpath --relative-to="$DRIVER_DIR" "$KERNEL_DIR/KernelSU/kernel")" "$DRIVER_DIR/kernelsu"
          
            # Modify Drivers Makefile
            if ! grep -q "kernelsu" "$DRIVER_MAKEFILE"; then
                printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$DRIVER_MAKEFILE"
            fi
          
            # Modify Drivers Kconfig
            if ! grep -q 'source "drivers/kernelsu/Kconfig"' "$DRIVER_KCONFIG"; then
                sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' "$DRIVER_KCONFIG"
            fi

            echo "${{ inputs['kernel-variant'] }}_SHA=$BAKASU_SHA" >> "$GITHUB_ENV"
            echo "✅ BakaSU installed successfully."
            ;;
          FINASU)
            # Clone FinaSU
            if [ ! -d "$KERNEL_DIR/FinaSU" ]; then
                git clone "$FINASU_REPO" "$KERNEL_DIR/FinaSU"
            fi
            
            # Update repository
            cd "$KERNEL_DIR/FinaSU"
            git stash
            git fetch origin --tags
          
            # Checkout master branch
            git checkout master
            git pull --ff-only origin master
          
            # Get latest stable tag and SHA
            FINASU_TAG=$(git describe --abbrev=0 --tags)
            FINASU_SHA=$(git rev-list -n 1 "$FINASU_TAG")
          
            git checkout "$FINASU_SHA"
          
            # Create drivers symbolic link
            ln -sf "$(realpath --relative-to="$DRIVER_DIR" "$KERNEL_DIR/FinaSU/kernel")" "$DRIVER_DIR/kernelsu"
          
            # Modify Drivers Makefile
            if ! grep -q "kernelsu" "$DRIVER_MAKEFILE"; then
                printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$DRIVER_MAKEFILE"
            fi
          
            # Modify Drivers Kconfig
            if ! grep -q 'source "drivers/kernelsu/Kconfig"' "$DRIVER_KCONFIG"; then
                sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' "$DRIVER_KCONFIG"
            fi

            echo "${{ inputs['kernel-variant'] }}_SHA=$FINASU_SHA" >> "$GITHUB_ENV"
            echo "✅ FinaSU installed successfully."
            ;;
        esac

        echo "::group::Disable Samsung KSU-related security restrictions"
        for config in \
          CONFIG_KSU_SAMSUNG_KDP \
          CONFIG_KSU_SAMSUNG_RKP \
          CONFIG_KSU_SAMSUNG_DEFEX \
          CONFIG_KSU_SAMSUNG_NO_PATCH_TEXT
        do
          if "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --disable "$config"; then
            echo "✅ Disabled $config"
          else
            echo "❌ Failed: $config"
            exit 1
          fi
        done
        echo "::endgroup::"

        if "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable CONFIG_KSU; then
            echo "✅ Enabled CONFIG_KSU"
        else
            echo "❌ Failed: CONFIG_KSU"
            exit 1
        fi

    - name: FinaSU manager certificate
      if: ${{ inputs['kernel-variant'] == 'FINASU' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}   # Optional
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/extract-finasu-manager-cert.py" --ksu-dir "$KERNEL_DIR/FinaSU"
        
    - name: Calculate KernelSU Version
      if: ${{ inputs['kernel-variant'] != 'CLEAN' }}
      shell: bash
      run: |
        set -euo pipefail
        
        case "${{ inputs['kernel-variant'] }}" in
          KSU|BAKASU) KSU_DIR="$KERNEL_DIR/KernelSU" ;;
          KSUN)       KSU_DIR="$KERNEL_DIR/KernelSU-Next" ;;
          FINASU)     KSU_DIR="$KERNEL_DIR/FinaSU" ;;
        esac
        
        VERSION_OFFSET=30000
        [[ "${{ inputs['kernel-variant'] }}" == "BAKASU" ]] && VERSION_OFFSET=30700
        
        KSU_COMMIT_COUNT=$(git -C "$KSU_DIR" rev-list --count HEAD)
        KSU_VERSION=$((VERSION_OFFSET + KSU_COMMIT_COUNT))
        
        echo "${{ inputs['kernel-variant'] }}_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"
        
    - name: Enable SUSFS
      if: ${{ inputs['kernel-variant'] != 'CLEAN' && inputs['enable-susfs'] == 'true' }}
      shell: bash
      env:
        SUSFS_DIR: "${{ github.workspace }}/susfs4ksu"
        SUSFS_REPO: "https://gitlab.com/simonpunk/susfs4ksu"
        SUSFS_BRANCH: "gki-android13-5.15"
        # SUSFS commit for latest stable KernelSU from tiann
        KSU_SUSFS_STABLECOMMIT: "bd27d727b27fc90bfbb6eaccd28060a53c473266"
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/latest-commit-hash.sh" # loads latest_commit function

        if [ "${{ inputs['kernel-variant'] }}" == 'KSU' ]; then
          SUSFS_SHA="$KSU_SUSFS_STABLECOMMIT"
          echo "KSU variant detected. Using stable SUSFS commit: $SUSFS_SHA"
        else
          SUSFS_SHA=$(latest_commit "$SUSFS_REPO" "$SUSFS_BRANCH") || exit 1
          echo "${{ inputs['kernel-variant'] }} variant detected. Using latest SUSFS commit: $SUSFS_SHA"
        fi

        # Clone SUSFS repo
        if [ ! -d "$SUSFS_DIR" ]; then
            git clone "$SUSFS_REPO" "$SUSFS_DIR"
        fi

        # Update repository
        cd "$SUSFS_DIR"
        git stash
        git fetch origin

        # Checkout SUSFS commit
        git checkout "$SUSFS_SHA"

        if [ "${{ inputs['kernel-variant'] }}" == 'KSU' ]; then
            cp "$SUSFS_DIR/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" "$KERNEL_DIR/KernelSU"
            cd "$KERNEL_DIR/KernelSU"
            KSU_PATCH_STATUS=0
            patch -p1 < "10_enable_susfs_for_ksu.patch" || KSU_PATCH_STATUS=$?
            echo "10_enable_susfs_for_ksu.patch ended code: $KSU_PATCH_STATUS"

            if [ "$KSU_PATCH_STATUS" -ne 0 ]; then
                echo "::group::Archivos .rej"
                python3 "$GITHUB_ACTION_PATH/rej-files-check.py" "$KERNEL_DIR"
                echo "::endgroup::"
                
                echo "::error::KSU patch failed, review the .rej files above."
                exit 1
            fi
        fi
        
        cp "$SUSFS_DIR/kernel_patches/fs/"*.c "$KERNEL_DIR/fs/" && echo "Copied SUSFS .c files successfully"
        cp "$SUSFS_DIR/kernel_patches/include/linux/"*.h "$KERNEL_DIR/include/linux/" && echo "Copied SUSFS .h files successfully"
        cp "$SUSFS_DIR/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch" "$KERNEL_DIR" && echo "Copied SUSFS patch successfully"

        cd "$KERNEL_DIR"
        echo "::group::Adjusting SUSFS patch for kernel compatibility..."
        python3 "$GITHUB_ACTION_PATH/susfs-fix.py"
        echo "::endgroup::"
        
        PATCH_STATUS=0
        patch -p1 < "50_add_susfs_in_gki-android13-5.15.patch" || PATCH_STATUS=$?
        echo "50_add_susfs_in_gki-android13-5.15.patch ended code: $PATCH_STATUS"
        
        if [ "$PATCH_STATUS" -ne 0 ]; then
            echo "::group::Archivos .rej"
            python3 "$GITHUB_ACTION_PATH/rej-files-check.py" "$KERNEL_DIR"
            echo "::endgroup::"
            
            echo "::error::SUSFS patch failed, Review the .rej files above."
            exit 1
        fi

        if "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable CONFIG_KSU_SUSFS; then
            echo "✅ Enabled CONFIG_KSU_SUSFS"
        else
            echo "❌ Failed: CONFIG_KSU_SUSFS"
            exit 1
        fi

        echo "SUSFS_SHA=$SUSFS_SHA" >> "$GITHUB_ENV"
        echo "✅ SUSFS installed successfully."
        
    - name: Apply Kernel Optimization Patches
      if: ${{ inputs['apply-kpatches'] == 'true' }}
      shell: bash
      env:
        KPATCHES_DIR: ${{ github.workspace }}/patches
      run: |
        cd "$KERNEL_DIR"
        for patch in "$KPATCHES_DIR"/*.patch; do
          echo "Applying patch: $(basename "$patch")"
        
          if patch -p1 < "$patch"; then
            echo "✅ Successfully applied: $(basename "$patch")"
          else
            echo "❌ Failed to apply: $(basename "$patch")"
            exit 1
          fi
        done
        
    - name: Enable Baseband Guard
      if: ${{ inputs['enable-bbg'] == 'true' }}
      shell: bash
      env:
        BBG_DIR: "${{ env.KERNEL_DIR }}/Baseband-guard"
        BBG_REPO: "https://github.com/vc-teahouse/Baseband-guard"
        BBG_BRANCH: "main"
      run: |
        set -euo pipefail
        
        # Clone repository
        if [ ! -d "$BBG_DIR" ]; then
            git clone "$BBG_REPO" "$BBG_DIR"
        fi
        
        # Update repository and tags
        git -C "$BBG_DIR" fetch origin --tags
        
        # Get latest tag and its SHA
        BBG_TAG=$(git -C "$BBG_DIR" describe --tags --abbrev=0 origin/main)
        BBG_SHA=$(git -C "$BBG_DIR" rev-list -n 1 "$BBG_TAG")
                
        # Run setup script from kernel root
        cd "$KERNEL_DIR"
        bash "$BBG_DIR/setup.sh" "$BBG_SHA"
        
        # Enable Baseband Guard
        if "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable CONFIG_BBG; then
            echo "✅ Enabled CONFIG_BBG"
        else
            echo "❌ Failed: CONFIG_BBG"
            exit 1
        fi
        
        # Update LSM configuration
        sed -i '/^CONFIG_LSM=/ s/"$/,baseband_guard"/' "$DEFCONFIG"
        sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
        
        echo "CONFIG_LSM after enabling BBG:"
        grep '^CONFIG_LSM=' "$DEFCONFIG"

        echo "BBG_SHA=$BBG_SHA" >> "$GITHUB_ENV"
        echo "✅ Baseband Guard enabled successfully."
        
    - name: Enable more NET schedulers
      if: ${{ inputs.enable-netsch == 'true' }}
      shell: bash
      run: |
        for config in \
          CONFIG_NET_SCH_FQ \
          CONFIG_NET_SCH_FQ_CODEL \
          CONFIG_NET_SCH_PIE \
          CONFIG_NET_SCH_FQ_PIE \
          CONFIG_NET_SCH_CAKE
        do
          if "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable "$config"; then
            echo "✅ Enabled $config"
          else
            echo "❌ Failed: $config"
            exit 1
          fi
        done
        
    - name: Enable BBR & BBRv3
      if: ${{ inputs['enable-bbrv3'] == 'true' }}
      shell: bash
      env:
        BBRV3_BBR_PATCH: "${{ github.action_path }}/net-tcp-backport-BBRv3-to-android13-5.15.patch"
      run: |
        cd "$KERNEL_DIR"
        
        if patch -p1 < "$BBRV3_BBR_PATCH"; then
          echo "✅ Successfully applied: $(basename "$BBRV3_BBR_PATCH")"
        else
          echo "❌ Failed to apply: $(basename "$BBRV3_BBR_PATCH")"
          exit 1
        fi
        
        for config in \
          CONFIG_TCP_CONG_ADVANCED \
          CONFIG_TCP_CONG_BBR \
          CONFIG_TCP_CONG_BBR3
        do
          if "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable "$config"; then
            echo "✅ Enabled $config"
          else
            echo "❌ Failed: $config"
            exit 1
          fi
        done
        
    - name: Enable extended TMPFS support for meta modules and Mountify
      if: ${{ inputs['kernel-variant'] != 'CLEAN' && inputs['extended-tmpfs'] == 'true' }}
      shell: bash
      run: |
        for config in \
          CONFIG_OVERLAY_FS \
          CONFIG_TMPFS_XATTR \
          CONFIG_TMPFS_POSIX_ACL
        do
          if "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable "$config"; then
            echo "✅ Enabled $config"
          else
            echo "❌ Failed: $config"
            exit 1
          fi
        done
        
    - name: Add built-in VFS support for Hybrid-Mount MetaModule
      if: ${{ inputs['kernel-variant'] != 'CLEAN' && inputs['vfs-support'] == 'Hybrid-Mount' }}
      shell: bash
      env:
        HYBRIDMOUNT_DIR: "${{ env.KERNEL_DIR }}/meta-hybrid_mount"
        HYBRIDMOUNT_REPO: "https://github.com/Hybrid-Mount/meta-hybrid_mount"
        HYBRIDMOUNT_BRANCH: "dev"
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/latest-commit-hash.sh"

        if [ ${{ inputs['kernel-variant'] }} == "FINASU" ]; then
          echo "::error::FinaSU VFS Support have to be NoMount"
          exit 1
        fi
        
        # Get latest commit SHA
        cd "$KERNEL_DIR"
        HYBRIDMOUNT_SHA=$(latest_commit "$HYBRIDMOUNT_REPO" "$HYBRIDMOUNT_BRANCH") || exit 1
        
        # Clone repository
        if [ ! -d "$HYBRIDMOUNT_DIR" ]; then
            git clone "$HYBRIDMOUNT_REPO" "$HYBRIDMOUNT_DIR"
        fi
        
        # Update Repository
        cd "$HYBRIDMOUNT_DIR"
        git stash
        git fetch origin "$HYBRIDMOUNT_BRANCH"

        # Checkout selected commit
        git checkout "$HYBRIDMOUNT_SHA"
        
        # Run setup script from kernel root
        cd "$KERNEL_DIR"
        bash "$HYBRIDMOUNT_DIR/module/vfs/setup.sh"
        
        # Enable Hybrid Mount
        if "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable CONFIG_HYBRIDMOUNT; then
            echo "✅ Enabled CONFIG_HYBRIDMOUNT"
        else
            echo "❌ Failed: CONFIG_HYBRIDMOUNT"
            exit 1
        fi
        
        echo "HYBRIDMOUNT_SHA=$HYBRIDMOUNT_SHA" >> "$GITHUB_ENV"
        echo "✅ Hybrid Mount installed successfully."
        
    - name: Add built-in VFS support for NoMount MetaModule
      if: ${{ inputs['kernel-variant'] != 'CLEAN' && inputs['vfs-support'] == 'NoMount' }}
      shell: bash
      env:
        NOMOUNT_DIR: "${{ env.KERNEL_DIR }}/nomount"
        NOMOUNT_REPO: "https://github.com/maxsteeel/nomount"
        NOMOUNT_BRANCH: "dev"
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/latest-commit-hash.sh"
        
        # Get latest commit SHA
        cd "$KERNEL_DIR"
        NOMOUNT_SHA=$(latest_commit "$NOMOUNT_REPO" "$NOMOUNT_BRANCH") || exit 1
        
        # Clone repository
        if [ ! -d "$NOMOUNT_DIR" ]; then
            git clone "$NOMOUNT_REPO" "$NOMOUNT_DIR"
        fi

        # Update Repository
        cd "$NOMOUNT_DIR"
        git stash
        git fetch origin "$NOMOUNT_BRANCH"

        # Checkout selected commit
        git checkout "$NOMOUNT_SHA"

        # Run setup script from kernel root
        cd "$KERNEL_DIR"
        bash "$NOMOUNT_DIR/kernel/setup.sh"
        
        # Enable NoMount
        if "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable CONFIG_NOMOUNT; then
            echo "✅ Enabled CONFIG_NOMOUNT"
        else
            echo "❌ Failed: CONFIG_NOMOUNT"
            exit 1
        fi
        
        echo "NOMOUNT_SHA=$NOMOUNT_SHA" >> "$GITHUB_ENV"
        echo "✅ NoMount installed successfully."
        
    - name: Apply EXPERIMENTAL battery tweak
      if: ${{ inputs['battery-tweak'] == 'true' }}
      shell: bash
      run: |
        echo "::notice::This tweak is experimental because I have not personally tested it yet. \
        While it is not expected to cause any issues, I cannot guarantee that it will improve battery life. \
        Use it at your own discretion, do your own research, and please share your results!"
        if "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable CONFIG_WQ_POWER_EFFICIENT_DEFAULT; then
            echo "✅ Enabled CONFIG_WQ_POWER_EFFICIENT_DEFAULT"
        else
            echo "❌ Failed: CONFIG_WQ_POWER_EFFICIENT_DEFAULT"
            exit 1
        fi

    - name: Create Kernel Info.txt & Place it into AnyKernel3
      shell: bash
      run: |
        set -euo pipefail

        INFO_FILE="$ANYKERNEL3_DIR/kernel-info.txt"
        VARIANT="${{ inputs['kernel-variant'] }}"

        # KernelSU variant
        case "$VARIANT" in
          CLEAN)  KSU_VARIANT="None" ;;
          KSU)    KSU_VARIANT="KernelSU" ;;
          KSUN)   KSU_VARIANT="KernelSU-Next" ;;
          BAKASU) KSU_VARIANT="BakaSU" ;;
          FINASU) KSU_VARIANT="FinaSU" ;;
          *)
            echo "::error::Unknown KernelSU variant: $VARIANT"
            exit 1
            ;;
        esac

        # Get KernelSU version dynamically
        KSU_VERSION=""
        
        if [[ "$VARIANT" != "CLEAN" ]]; then
            VERSION_VAR="${VARIANT}_VERSION"
            KSU_VERSION="${!VERSION_VAR:-}"
        fi

        # Modification statuses
        SECURITIES_STATUS="Enabled"
        [[ "${{ inputs['disable-securities'] }}" == "true" ]] && SECURITIES_STATUS="Disabled"

        SUSFS_STATUS="Unsupported"
        [[ "$VARIANT" != "CLEAN" && "${{ inputs['enable-susfs'] }}" == "true" ]] && SUSFS_STATUS="Supported"

        KPATCHES_STATUS="NO"
        [[ "${{ inputs['apply-kpatches'] }}" == "true" ]] && KPATCHES_STATUS="YES"

        BBG_STATUS="NO"
        [[ "${{ inputs['enable-bbg'] }}" == "true" ]] && BBG_STATUS="YES"

        NETSCHED_STATUS="NO"
        [[ "${{ inputs['enable-netsch'] }}" == "true" ]] && NETSCHED_STATUS="YES"

        BBRV3_STATUS="NO"
        [[ "${{ inputs['enable-bbrv3'] }}" == "true" ]] && BBRV3_STATUS="YES"

        BTWEAK_STATUS="NO"
        [[ "${{ inputs['battery-tweak'] }}" == "true" ]] && BTWEAK_STATUS="YES"

        VFS_SUPPORT="Disabled"
        [[ "$VARIANT" != "CLEAN" && "${{ inputs['vfs-support'] }}" != "Disabled" ]] && VFS_SUPPORT="${{ inputs['vfs-support'] }}"

        # Create information file
        cat > "$INFO_FILE" <<EOF
        ==========  KERNEL INFO  ==========
        Device: $DEVICE_MODEL
        Kernel Version: $KERNEL_VERSION
        Build Date: $BUILD_DATE
        One UI Version: $ONEUI_VERSION
        LTO Mode: $LTO_MODE
        KernelSU Variant: $KSU_VARIANT
        EOF

        if [ -n "$KSU_VERSION" ]; then
          echo "$KSU_VARIANT Version: $KSU_VERSION" >> "$INFO_FILE"
        fi

        cat >> "$INFO_FILE" <<EOF

        =====  MODIFICATIONS APPLIED  =====
        Samsung Securities: $SECURITIES_STATUS
        SUSFS: $SUSFS_STATUS
        Optimization Patches: $KPATCHES_STATUS
        Baseband Guard: $BBG_STATUS
        More Net Schedulers: $NETSCHED_STATUS
        BBRv3 & BBR: $BBRV3_STATUS
        VFS Support: $VFS_SUPPORT
        EXPERIMENTAL Battery Tweak: $BTWEAK_STATUS

        ===========  GIT HASHES  ===========
        EOF

        # Add available Git hashes
        SHA_VARS=()
        
        if [[ "$VARIANT" != "CLEAN" ]]; then
            SHA_VARS+=("${VARIANT}_SHA")
        fi
        
        SHA_VARS+=(SUSFS_SHA BBG_SHA HYBRIDMOUNT_SHA NOMOUNT_SHA)
        
        for var in "${SHA_VARS[@]}"; do
            value="${!var:-}"
            if [[ -n "$value" ]]; then
                echo "$var: $value" >> "$INFO_FILE"
            fi
        done

        cat "$INFO_FILE"
        echo "✅ Kernel information saved to $INFO_FILE"

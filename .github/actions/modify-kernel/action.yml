name: Modify Kernel
description: Modify Kernel

inputs:
  kernel-variant:
    description: "Kernel variant"
  enable-susfs:
    description: "Enable SUSFS"
  apply-kpatches:
    description: "Apply optimization patches"
  enable-bbg:
    description: "Enable Baseband Guard"
  enable-netsch:
    description: "Enable more NET schedulers"
  enable-wireguard:
    description: "Enable Wireguard"
  enable-bbrv3:
    description: "Enable BBR & BBRv3"
  extended-tmpfs:
    description: "Enable extended TMPFS support for meta modules and Mountify"
  vfs-support:
    description: "Add VFS support for selected MetaModule"
  battery-tweak:
    description: "EXPERIMENTAL battery tweak"
    
runs:
  using: composite
  steps:
    - name: Disable Samsung security features
      shell: bash
      run: |
        cd "$KERNEL_DIR"
        DEFCONFIG="$KERNEL_DIR/arch/arm64/configs/s5e8835-a35xjvxx_defconfig"

        echo "Disabling Samsung security features..."
        "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" \
          --disable CONFIG_UH \
          --disable CONFIG_UH_RKP \
          --disable CONFIG_UH_LKMAUTH \
          --disable CONFIG_UH_LKM_BLOCK \
          --disable CONFIG_RKP \
          --disable CONFIG_RKP_CFP \
          --disable CONFIG_RKP_CFP_JOPP \
          --disable CONFIG_RKP_CFP_ROPP \
          --disable CONFIG_KDP \
          --disable CONFIG_KDP_NS \
          --disable CONFIG_SECURITY_DEFEX \
          --disable CONFIG_FIVE \
          --disable CONFIG_PROCA
        echo "Done :v"
        
        echo "Disabling check defconfig..."
        sed -i 's/check_defconfig//' "$KERNEL_DIR/build.config.gki"
        echo "Done :v"
        
    - name: Install KernelSU variant
      if: ${{ inputs['kernel-variant'] != 'Puck' }}
      shell: bash
      run: |    
        cd "$KERNEL_DIR"
        case "${{ inputs['kernel-variant'] }}" in
          KSU)
            echo "Installing KernelSU from tiann..."
            curl -fLSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
            ;;
          KSUN)
            echo "Installing KernelSU-Next..."
            if [[ "${{ inputs.enable-susfs }}" == "true" ]]; then
              echo "Using pershoot repo for SUSFS support."
              curl -fLSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -
            else
              echo "Using official repo."
              curl -fLSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
            fi
            "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --disable CONFIG_KSU_SAMSUNG_KDP
            "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --disable CONFIG_KSU_SAMSUNG_RKP
            "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --disable CONFIG_KSU_SAMSUNG_DEFEX
            "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --disable CONFIG_KSU_SAMSUNG_NO_PATCH_TEXT
            ;;
          BAKASU)
            echo "Installing Baka-SU..."
            curl -fLSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash
            ;;
          FINASU)
            echo "Installing Fina-SU..."
            curl -fLSs "https://raw.githubusercontent.com/LyraVoid/FinaSU/maaster/kernel/setup.sh" | bash
            ;;
          *)
            echo "No KernelSU variant selected or unknown variant."
            ;;
        esac
        
        "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable CONFIG_KSU
        echo "Done :v"
        
    - name: Enable SUSFS
      if: ${{ inputs.enable-susfs == 'true' }}
      shell: bash
      env:
        SUSFS_DIR: ${{ github.workspace }}/susfs4ksu
        SUSFS_REPO: "https://gitlab.com/simonpunk/susfs4ksu.git"
        SUSFS_BRANCH: "gki-android13-5.15"
        STABLECOMMIT: "23d85d2278f3e481644f809053868b6153715583"
        KERNEL_VARIANT: ${{ inputs['kernel-variant'] }}
      run: |
        case "${{ inputs['kernel-variant'] }}" in
          CLEAN)
            echo "Puck variant selected. SUSFS is not supported for Puck."
            exit 0
            ;;
          KSU|KSUN|BAKASU|FINASU)
            # Prepare SUSFS directory
            rm -rf "$SUSFS_DIR"
            mkdir "$SUSFS_DIR"
            cd "$SUSFS_DIR"
            ;;
          *)
            echo "Unknown kernel variant: ${{ inputs['kernel-variant'] }}. SUSFS installation skipped."
            exit 1
            ;;
        esac

        echo "::group::GitCloning SUSFS :v"
        if [ "$KERNEL_VARIANT" = "KSU" ]; then
            echo "Zodd variant detected. Using stable SUSFS commit: $STABLECOMMIT"
            git init
            git remote add origin "$SUSFS_REPO"
            git fetch --depth=1 origin "$STABLECOMMIT"
            git checkout FETCH_HEAD
            
            cp "$SUSFS_DIR/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" "$KERNEL_DIR/KernelSU/"
            cd "$KERNEL_DIR/KernelSU"
            KSU_PATCH_STATUS=0
            patch -p1 < "10_enable_susfs_for_ksu.patch" || KSU_PATCH_STATUS=$?
            echo "10_enable_susfs_for_ksu.patch ended code: $KSU_PATCH_STATUS"

            if [ "$KSU_PATCH_STATUS" -ne 0 ]; then
                echo "::group::Archivos .rej"
                python3 "$GITHUB_ACTION_PATH/rej-files-check.py" "$KERNEL_DIR"
                echo "::endgroup::"
                
                echo "::error::KSU patch failed, review the .rej files above."
                exit 1
            fi
        else
            echo "${{ inputs['kernel-variant'] }} variant detected. Using latest SUSFS."
            git init
            git remote add origin "$SUSFS_REPO"
            git fetch --depth=1 origin "$SUSFS_BRANCH"
            git checkout FETCH_HEAD
        fi
        echo "::endgroup::"
        
        cd "$KERNEL_DIR"
        cp "$SUSFS_DIR/kernel_patches/fs/"*.c "$KERNEL_DIR/fs/" && echo "Copied SUSFS .c files successfully"
        cp "$SUSFS_DIR/kernel_patches/include/linux/"*.h "$KERNEL_DIR/include/linux/" && echo "Copied SUSFS .h files successfully"
        cp "$SUSFS_DIR/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch" "$KERNEL_DIR" && echo "Copied SUSFS patch successfully"
        
        echo "::group::Adjusting SUSFS patch for kernel compatibility..."
        python3 "$GITHUB_ACTION_PATH/susfs-fix.py"
        echo "::endgroup::"
        
        PATCH_STATUS=0
        patch -p1 < "50_add_susfs_in_gki-android13-5.15.patch" || PATCH_STATUS=$?
        echo "50_add_susfs_in_gki-android13-5.15.patch ended code: $PATCH_STATUS"
        
        if [ "$PATCH_STATUS" -ne 0 ]; then
            echo "::group::Archivos .rej"
            python3 "$GITHUB_ACTION_PATH/rej-files-check.py" "$KERNEL_DIR"
            echo "::endgroup::"
            
            echo "::error::SUSFS patch failed, Review the .rej files above."
            exit 1
        fi
        
        "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable CONFIG_KSU_SUSFS
        echo "SUSFS Installed."
        
    - name: Apply Kernel Optimization Patches
      if: ${{ inputs.apply-kpatches == 'true' }}
      shell: bash
      env:
        KPATCHES_DIR: ${{ github.workspace }}/patches
      run: |
        echo "Applying kernel optimization patches..."
        cd "$KERNEL_DIR"
        for patch in "$KPATCHES_DIR"/*.patch; do
          echo "Applying patch: $patch"
          patch -p1 < "$patch"
        done
        echo "Done :v"
        
    - name: Enable Baseband Guard
      if: ${{ inputs.enable-bbg == 'true' }}
      shell: bash
      run: |
        echo "Enabling Baseband Guard..."
        cd "$KERNEL_DIR"
        curl -LSs https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
        "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable CONFIG_BBG
        sed -i '/^CONFIG_LSM=/ s/"$/,baseband_guard"/' "$DEFCONFIG"
        sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
        echo "CONFIG_LSM after enabling BBG:"
        grep '^CONFIG_LSM=' "$DEFCONFIG"
        echo "Done :v"
        
    - name: Enable more NET schedulers
      if: ${{ inputs.enable-netsch == 'true' }}
      shell: bash
      run: |
        echo "Enabling more Network Schedulers..."
        "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" \
          --enable CONFIG_NET_SCH_FQ \
          --enable CONFIG_NET_SCH_FQ_CODEL \
          --enable CONFIG_NET_SCH_PIE \
          --enable CONFIG_NET_SCH_FQ_PIE \
          --enable CONFIG_NET_SCH_CAKE
        echo "Done :v"
        
    - name: Enable Wireguard
      if: ${{ inputs.enable-wireguard == 'true' }}
      shell: bash
      run: |
        echo "Enabling Wireguard..."
        "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable CONFIG_WIREGUARD
        echo "Done :v"
        
    - name: Enable BBR & BBRv3
      if: ${{ inputs.enable-bbrv3 == 'true' }}
      shell: bash
      run: |
        cd "$KERNEL_DIR"
        patch -p1 < "$GITHUB_ACTION_PATH/net-tcp-backport-BBRv3-to-android13-5.15.patch"
        "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" \
          --enable CONFIG_TCP_CONG_ADVANCED \
          --enable CONFIG_TCP_CONG_BBR \
          --enable CONFIG_TCP_CONG_BBR3
        echo "Done :v"
        
    - name: Enable extended TMPFS support for meta modules and Mountify
      if: ${{ inputs.extended-tmpfs == 'true' }}
      shell: bash
      run: |
        echo "Adding extended TMPFS support for meta modules and Mountify..."
        "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" \
          --enable CONFIG_OVERLAY_FS \
          --enable CONFIG_TMPFS_XATTR \
          --enable CONFIG_TMPFS_POSIX_ACL
        echo "Done :v"
        
    - name: Add VFS support for Hybrid Mount MetaModule
      if: ${{ inputs.vfs-support != 'Disabled' }}
      shell: bash
      env:
        METAMODULE: ${{ inputs.vfs-support }}
      run: |
        cd "$KERNEL_DIR"
        if [[ "$METAMODULE" == "Hybrid-Mount" ]]; then
          echo "Adding VFS support for Hybrid Mount..."
          curl -fLSs "https://raw.githubusercontent.com/Hybrid-Mount/meta-hybrid_mount/dev/module/vfs/setup.sh" | bash
          "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable CONFIG_HYBRIDMOUNT
        elif [[ "$METAMODULE" == "NoMount" ]]; then
          echo "Adding NoMount Built-In Integration..."
          curl -fLSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" | bash -
          "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable CONFIG_NOMOUNT
        else
          echo "Unsupported metamodule: $METAMODULE"
          exit 1
        fi
        echo "Done :v"
        
    - name: Apply EXPERIMENTAL battery tweak
      if: ${{ inputs.battery-tweak == 'true' }}
      shell: bash
      run: |
        echo "Enabling EXPERIMENTAL battery tweak..." 
        "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable CONFIG_WQ_POWER_EFFICIENT_DEFAULT
        echo "Done :v"

name: Apply kernel Modifications
description: Apply kernel mods
inputs:
  LinkTO:
    required: true
  ksu_variant:
    required: true
  ksun_branch:
    required: false
    default: stable

runs:
  using: composite
  steps:
    - name: Set LTO Mode
      shell: bash
      run: |
        echo "===== LTO CONFIGURATION ====="
        echo "LTO mode: ${{ inputs.LinkTO }}"
        echo "Defconfig: $A35_DEFCONFIG"
        
        if [[ "${{ inputs.LinkTO }}" == "full" ]]; then
          echo "Enabling Full LTO..."
        
          "$KERNEL_DIR/scripts/config" \
            --file "$A35_DEFCONFIG" \
            --enable CONFIG_LTO_CLANG \
            --disable CONFIG_LTO_NONE \
            --disable CONFIG_LTO_CLANG_THIN \
            --enable CONFIG_LTO_CLANG_FULL
        
        elif [[ "${{ inputs.LinkTO }}" == "thin" ]]; then
          echo "Enabling Thin LTO..."
        
          "$KERNEL_DIR/scripts/config" \
            --file "$A35_DEFCONFIG" \
            --enable CONFIG_LTO_CLANG \
            --disable CONFIG_LTO_NONE \
            --disable CONFIG_LTO_CLANG_FULL \
            --enable CONFIG_LTO_CLANG_THIN
        
        else
          echo "LTO is default, no changes to defconfig"
        fi
        
        echo "===== LTO CONFIG RESULT ====="
        grep -E 'CONFIG_(LTO|LTO_CLANG)' "$A35_DEFCONFIG" || true
        echo "============================="

    - name: Add Kernel SU Next
      if: inputs.ksu_variant == 'ksu-next'
      shell: bash
      run: |
        cd "$KERNEL_DIR"
        if [[ "${{ inputs.ksun_branch }}" == "dev" ]]; then
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s dev
        else
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s stable
        fi

# Save command:
# ${{ inputs['kernel-variant'] }}_SHA=$(latest_commit "$KSU_REPO.git" "main")

name: Modify Kernel
description: Modify Kernel

inputs:
  disable-securities:
    description: "Disable Samsung Securities"
  kernel-variant:
    description: "Kernel variant"
  enable-susfs:
    description: "Enable SUSFS"
  apply-kpatches:
    description: "Apply optimization patches"
  enable-bbg:
    description: "Enable Baseband Guard"
  enable-netsch:
    description: "Enable more NET schedulers"
  enable-wireguard:
    description: "Enable Wireguard"
  enable-bbrv3:
    description: "Enable BBR & BBRv3"
  extended-tmpfs:
    description: "Enable extended TMPFS support for meta modules and Mountify"
  vfs-support:
    description: "Add VFS support for selected MetaModule"
  battery-tweak:
    description: "EXPERIMENTAL battery tweak"
    
runs:
  using: composite
  steps:
    - name: Disable Defconfig Check
      shell: bash
      run: |
        if sed -i 's/check_defconfig//' "$KERNEL_DIR/build.config.gki"; then
          echo "✅ Disabled"
        else
          echo "❌ Failed to modify build.config.gki"
          exit 1
        fi

    - name: Disable Samsung security features
      shell: bash
      run: |
        for config in \
          CONFIG_UH \
          CONFIG_UH_RKP \
          CONFIG_UH_LKMAUTH \
          CONFIG_UH_LKM_BLOCK \
          CONFIG_RKP \
          CONFIG_RKP_CFP \
          CONFIG_RKP_CFP_JOPP \
          CONFIG_RKP_CFP_ROPP \
          CONFIG_KDP \
          CONFIG_KDP_NS \
          CONFIG_SECURITY_DEFEX \
          CONFIG_FIVE \
          CONFIG_PROCA
        do
          if "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --disable "$config"; then
            echo "✅ Disabled $config"
          else
            echo "❌ Failed: $config"
            exit 1
          fi
        done
        
    - name: Install ${{ inputs['kernel-variant'] }}
      if: ${{ inputs['kernel-variant'] != 'CLEAN' }}
      shell: bash
      env:
        KSU_REPO: "https://github.com/tiann/KernelSU"
        KSUN_REPO: "https://github.com/KernelSU-Next/KernelSU-Next"
        KSUN_SUSFS_REPO: "https://github.com/pershoot/KernelSU-Next"
        BAKASU_REPO: "https://github.com/Baka-SU/BakaSU"
        FINASU_REPO: "https://github.com/LyraVoid/FinaSU"
      run: | 
        source "$GITHUB_ACTION_PATH/latest-commit-hash.sh" # loads latest_commit function
        
        cd "$KERNEL_DIR"
        DRIVER_DIR="$KERNEL_DIR/drivers"
        DRIVER_MAKEFILE="$DRIVER_DIR/Makefile"
        DRIVER_KCONFIG="$DRIVER_DIR/Kconfig"
        
        case "${{ inputs['kernel-variant'] }}" in
          KSU)
            if [ ! -d "$KERNEL_DIR/KernelSU" ]; then
                git clone "$KSU_REPO" "$KERNEL_DIR/KernelSU"
            fi
            cd "$KERNEL_DIR/KernelSU"
            git stash
            git pull
            
            KSU_TAG=$(git describe --abbrev=0 --tags)
            KSU_SHA=$(git rev-list -n 1 "$KSU_TAG")
            git checkout "$KSU_SHA"

            # Create drivers symbolic link
            ln -sf "$(realpath --relative-to="$DRIVER_DIR" "$KERNEL_DIR/KernelSU/kernel")" "$DRIVER_DIR/kernelsu"

            # Modify Drivers Makefile
            if ! grep -q "kernelsu" "$DRIVER_MAKEFILE"; then
                printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$DRIVER_MAKEFILE"
            fi

            # Modify Drivers Kconfig
            if ! grep -q 'source "drivers/kernelsu/Kconfig"' "$DRIVER_KCONFIG"; then
                sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' "$DRIVER_KCONFIG"
            fi
            ;;
          KSUN)
            echo "Installing KernelSU-Next..."
            if [[ "${{ inputs.enable-susfs }}" == "true" ]]; then
              echo "Using pershoot repo for SUSFS support."
              curl -fLSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -
            else
              echo "Using official repo."
              curl -fLSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
            fi
            "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --disable CONFIG_KSU_SAMSUNG_KDP
            "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --disable CONFIG_KSU_SAMSUNG_RKP
            "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --disable CONFIG_KSU_SAMSUNG_DEFEX
            "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --disable CONFIG_KSU_SAMSUNG_NO_PATCH_TEXT
            ;;
          BAKASU)
            echo "Installing Baka-SU..."
            curl -fLSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash
            ;;
          FINASU)
            echo "Prepare FinaSU directory & clone repo"
            FINASU_REPO="https://github.com/LyraVoid/FinaSU.git"
            FINASU_DIR="${{ github.workspace }}/FinaSU"
            FINASU_COMMIT=$(latest_commit "$FINASU_REPO" master)

            rm -rf "$FINASU_DIR"
            mkdir "$FINASU_DIR"
            cd "$FINASU_DIR"
            git init -q
            git remote add origin "$FINASU_REPO"
            git fetch --depth=1 origin "$FINASU_COMMIT"
            git checkout -q FETCH_HEAD
            record_commit FinaSU "$FINASU_COMMIT"

            echo "Installing FinaSU..."
            cd "$KERNEL_DIR"
            "$FINASU_DIR/kernel/setup.sh" --dir "$FINASU_DIR"
            ;;
          *)
            echo "No KernelSU variant selected or unknown variant."
            ;;
        esac

        # setup.sh clones the repo by itself, so record what actually ended up in the tree
        if [ "${{ inputs['kernel-variant'] }}" != "FINASU" ]; then
          record_linked_repo "${{ inputs['kernel-variant'] }}" "$KERNEL_DIR/drivers/kernelsu"
        fi
        
        "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable CONFIG_KSU
        echo "Done :v"

    - name: Enable SUSFS
      if: ${{ inputs['kernel-variant'] != 'CLEAN' && inputs['enable-susfs'] == 'true' }}
      shell: bash
      env:
        SUSFS_DIR: ${{ github.workspace }}/susfs4ksu
        SUSFS_REPO: "https://gitlab.com/simonpunk/susfs4ksu.git"
        SUSFS_BRANCH: "gki-android13-5.15"
      run: |
        source "$GITHUB_ACTION_PATH/commit-hash-extractor.sh"

        # Prepare SUSFS directory
        rm -rf "$SUSFS_DIR"
        mkdir "$SUSFS_DIR"
        cd "$SUSFS_DIR"

        case "${{ inputs['kernel-variant'] }}" in
          KSU|KSUN|BAKASU|FINASU)

            ;;
          *)
            echo "Unknown kernel variant: ${{ inputs['kernel-variant'] }}. SUSFS installation skipped."
            exit 1
            ;;
        esac

        echo "::group::GitCloning SUSFS :v"
        if [ "$KERNEL_VARIANT" = "KSU" ]; then
            echo "KSU variant detected. Using stable SUSFS commit: $STABLECOMMIT"
            SUSFS_COMMIT="$KSU_SUSFS_STABLECOMMIT"
        else
            echo "${{ inputs['kernel-variant'] }} variant detected. Using latest SUSFS."
            SUSFS_COMMIT=$(latest_commit "$SUSFS_REPO" "$SUSFS_BRANCH")
        fi

        git init
        git remote add origin "$SUSFS_REPO"
        git fetch --depth=1 origin "$SUSFS_COMMIT"
        git checkout FETCH_HEAD
        record_commit susfs4ksu "$SUSFS_COMMIT"

        if [ "$KERNEL_VARIANT" = "KSU" ]; then
            cp "$SUSFS_DIR/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" "$KERNEL_DIR/KernelSU/"
            cd "$KERNEL_DIR/KernelSU"
            KSU_PATCH_STATUS=0
            patch -p1 < "10_enable_susfs_for_ksu.patch" || KSU_PATCH_STATUS=$?
            echo "10_enable_susfs_for_ksu.patch ended code: $KSU_PATCH_STATUS"

            if [ "$KSU_PATCH_STATUS" -ne 0 ]; then
                echo "::group::Archivos .rej"
                python3 "$GITHUB_ACTION_PATH/rej-files-check.py" "$KERNEL_DIR"
                echo "::endgroup::"
                
                echo "::error::KSU patch failed, review the .rej files above."
                exit 1
            fi
        fi
        echo "::endgroup::"
        
        cd "$KERNEL_DIR"
        cp "$SUSFS_DIR/kernel_patches/fs/"*.c "$KERNEL_DIR/fs/" && echo "Copied SUSFS .c files successfully"
        cp "$SUSFS_DIR/kernel_patches/include/linux/"*.h "$KERNEL_DIR/include/linux/" && echo "Copied SUSFS .h files successfully"
        cp "$SUSFS_DIR/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch" "$KERNEL_DIR" && echo "Copied SUSFS patch successfully"
        
        echo "::group::Adjusting SUSFS patch for kernel compatibility..."
        python3 "$GITHUB_ACTION_PATH/susfs-fix.py"
        echo "::endgroup::"
        
        PATCH_STATUS=0
        patch -p1 < "50_add_susfs_in_gki-android13-5.15.patch" || PATCH_STATUS=$?
        echo "50_add_susfs_in_gki-android13-5.15.patch ended code: $PATCH_STATUS"
        
        if [ "$PATCH_STATUS" -ne 0 ]; then
            echo "::group::Archivos .rej"
            python3 "$GITHUB_ACTION_PATH/rej-files-check.py" "$KERNEL_DIR"
            echo "::endgroup::"
            
            echo "::error::SUSFS patch failed, Review the .rej files above."
            exit 1
        fi
        
        "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable CONFIG_KSU_SUSFS
        echo "SUSFS Installed."
        
    - name: Apply Kernel Optimization Patches
      if: ${{ inputs.apply-kpatches == 'true' }}
      shell: bash
      env:
        KPATCHES_DIR: ${{ github.workspace }}/patches
      run: |
        cd "$KERNEL_DIR"
        for patch in "$KPATCHES_DIR"/*.patch; do
          echo "Applying patch: $(basename "$patch")"
        
          if patch -p1 < "$patch"; then
            echo "✅ Successfully applied: $(basename "$patch")"
          else
            echo "❌ Failed to apply: $(basename "$patch")"
            exit 1
          fi
        done
        
    - name: Enable Baseband Guard
      if: ${{ inputs.enable-bbg == 'true' }}
      shell: bash
      run: |
        source "$GITHUB_ACTION_PATH/commit-hash-extractor.sh"
        echo "Enabling Baseband Guard..."
        cd "$KERNEL_DIR"

        BBG_REPO="vc-teahouse/Baseband-guard"
        BBG_COMMIT=$(latest_commit "https://github.com/$BBG_REPO.git" main)
        record_commit Baseband-guard "$BBG_COMMIT"
        curl -fLSs "https://raw.githubusercontent.com/$BBG_REPO/$BBG_COMMIT/setup.sh" | bash

        "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable CONFIG_BBG
        sed -i '/^CONFIG_LSM=/ s/"$/,baseband_guard"/' "$DEFCONFIG"
        sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
        echo "CONFIG_LSM after enabling BBG:"
        grep '^CONFIG_LSM=' "$DEFCONFIG"
        echo "Done :v"
        
    - name: Enable more NET schedulers
      if: ${{ inputs.enable-netsch == 'true' }}
      shell: bash
      run: |
        for config in \
          CONFIG_NET_SCH_FQ
          CONFIG_NET_SCH_FQ_CODEL \
          CONFIG_NET_SCH_PIE \
          CONFIG_NET_SCH_FQ_PIE \
          CONFIG_NET_SCH_CAKE
        do
          if "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable "$config"; then
            echo "✅ Enabled $config"
          else
            echo "❌ Failed: $config"
            exit 1
          fi
        done
        
    - name: Enable Wireguard
      if: ${{ inputs.enable-wireguard == 'true' }}
      shell: bash
      run: |
        if "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable CONFIG_WIREGUARD; then
            echo "✅ Enabled CONFIG_WIREGUARD"
        else
            echo "❌ Failed: CONFIG_WIREGUARD"
            exit 1
        fi
        
    - name: Enable BBR & BBRv3
      if: ${{ inputs.enable-bbrv3 == 'true' }}
      shell: bash
      run: |
        cd "$KERNEL_DIR"
        patch -p1 < "$GITHUB_ACTION_PATH/net-tcp-backport-BBRv3-to-android13-5.15.patch"

        for config in \
          CONFIG_TCP_CONG_ADVANCED \
          CONFIG_TCP_CONG_BBR \
          CONFIG_TCP_CONG_BBR3
        do
          if "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable "$config"; then
            echo "✅ Enabled $config"
          else
            echo "❌ Failed: $config"
            exit 1
          fi
        done
        
    - name: Enable extended TMPFS support for meta modules and Mountify
      if: ${{ inputs.extended-tmpfs == 'true' }}
      shell: bash
      run: |
        echo "Adding extended TMPFS support for meta modules and Mountify..."
        "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" \
          --enable CONFIG_OVERLAY_FS \
          --enable CONFIG_TMPFS_XATTR \
          --enable CONFIG_TMPFS_POSIX_ACL
        echo "Done :v"
        
    - name: Add VFS support for Hybrid Mount MetaModule
      if: ${{ inputs['vfs-support'] != 'Disabled' && inputs['kernel-variant'] != 'FINASU' }}
      shell: bash
      env:
        METAMODULE: ${{ inputs.vfs-support }}
      run: |
        source "$GITHUB_ACTION_PATH/commit-hash-extractor.sh"
        cd "$KERNEL_DIR"
        if [[ "$METAMODULE" == "Hybrid-Mount" ]]; then
          echo "Adding VFS support for Hybrid Mount..."
          HM_REPO="Hybrid-Mount/meta-hybrid_mount"
          HM_COMMIT=$(latest_commit "https://github.com/$HM_REPO.git" dev)
          record_commit Hybrid-Mount "$HM_COMMIT"
          curl -fLSs "https://raw.githubusercontent.com/$HM_REPO/$HM_COMMIT/module/vfs/setup.sh" | bash
          "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable CONFIG_HYBRIDMOUNT
        elif [[ "$METAMODULE" == "NoMount" ]]; then
          echo "Adding NoMount Built-In Integration..."
          NM_REPO="maxsteeel/nomount"
          NM_COMMIT=$(latest_commit "https://github.com/$NM_REPO.git" dev)
          record_commit NoMount "$NM_COMMIT"
          curl -fLSs "https://raw.githubusercontent.com/$NM_REPO/$NM_COMMIT/kernel/setup.sh" | bash -
          "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable CONFIG_NOMOUNT
        else
          echo "Unsupported metamodule: $METAMODULE"
          exit 1
        fi
        echo "Done :v"
        
    - name: Apply EXPERIMENTAL battery tweak
      if: ${{ inputs.battery-tweak == 'true' }}
      shell: bash
      run: |
        echo "Enabling EXPERIMENTAL battery tweak..." 
        "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable CONFIG_WQ_POWER_EFFICIENT_DEFAULT
        echo "Done :v"

        

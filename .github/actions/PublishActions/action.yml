name: Export files
description: Export kernel files

inputs:
  output_files:
    required: true
  oneui_version:
    required: true

runs:
  using: composite
  steps:
    - name: Publish Image in Actions
      if: inputs.output_files == 'image' || inputs.output_files == 'both'
      uses: actions/upload-artifact@v4
      with:
        name: RawImage-A356E-oneui${{ inputs.oneui_version }}
        path: ${{ env.KERNEL_DIR }}/arch/arm64/boot/Image
        
    - name: Copy Image file to Anykernel3
      if: inputs.output_files == 'flashable-zip' || inputs.output_files == 'both'
      shell: bash
      run: |
        cp "$KERNEL_DIR/arch/arm64/boot/Image" "$ANYKERNEL3_DIR"
        
    - name: Publish Kernel in Actions
      if: inputs.output_files == 'flashable-zip' || inputs.output_files == 'both'
      uses: actions/upload-artifact@v4
      with:
        name: RawKernel-A356E-oneui${{ inputs.oneui_version }}
        path: ${{ env.ANYKERNEL3_DIR }}

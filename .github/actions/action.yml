name: Publish files as Release/Prerelease
description: Publish files

inputs:
  prerelease:
    required: true

  # Release Details
  release_name:
    required: true
  release_tag:
    required: true

runs:
  using: composite
  steps:
    - name: Prepare release notes from changelog
      shell: bash
      run: |
        set -euo pipefail

        changelog="$GITHUB_WORKSPACE/CHANGELOG.md"
        release_notes="$GITHUB_WORKSPACE/release-notes.md"

        if [[ ! -f "$changelog" ]]; then
          echo "ERROR: Changelog file not found: $changelog"
          exit 1
        fi

        awk '
          /^## v[0-9]/ {
            sections++
            if (sections > 5) {
              exit
            }
          }
          sections > 0 {
            print
          }
          END {
            if (sections == 0) {
              exit 1
            }
          }
        ' "$changelog" > "$release_notes" || {
          echo "ERROR: No versioned release sections found in CHANGELOG.md."
          exit 1
        }

        echo "Selected the five most recent version sections from CHANGELOG.md."

    - name: Download Artifacts
      shell: bash
      run: |
        mkdir -p "$GITHUB_WORKSPACE/release_files"
        
        gh api \
          --paginate \
          "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
          --jq '.artifacts[].name' |
        while IFS= read -r artifact; do
          echo "Downloading: $artifact"
        
          mkdir -p "$GITHUB_WORKSPACE/release_files/$artifact"
        
          gh run download "${{ github.run_id }}" \
            --name "$artifact" \
            --dir "$GITHUB_WORKSPACE/release_files/$artifact"
        done
    
    - name: Compress Release Files
      shell: bash
      run: |
        shopt -s nullglob
        
        for dir in "$GITHUB_WORKSPACE"/release_files/*/; do
          [ -d "$dir" ] || continue
        
          name=$(basename "$dir")
        
          echo "Creating $name.zip..."
        
          cd "$dir"
          zip -r9 "../$name.zip" .
          cd - > /dev/null
        done
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        prerelease: ${{ inputs.prerelease }}
        name: ${{ inputs.release_name }}
        tag_name: ${{ inputs.release_tag }}
        body_path: ${{ github.workspace }}/release-notes.md
    
    - name: Upload Release Files
      shell: bash
      run: |
        shopt -s nullglob
        
        for zip_file in "$GITHUB_WORKSPACE"/release_files/*.zip; do
          [ -f "$zip_file" ] || continue
        
          echo "Uploading $(basename "$zip_file")..."
        
          gh release upload \
            "${{ inputs.release_tag }}" \
            "$zip_file" \
            --repo "${{ github.repository }}"
        done

name: Disable Samsung Kernel Security
description: Disable Samsung proprietary security and kernel protection features

runs:
  using: composite
  steps:
    - name: Disable Samsung security features
      shell: bash
      run: |
        echo "===== DISABLING SAMSUNG SECURITY FEATURES ====="

        "$KERNEL_DIR/scripts/config" \
          --file "$DEFCONFIG" \

          # Samsung Unified Hypervisor (UH) and LKM protection
          --disable CONFIG_UH \
          --disable CONFIG_UH_RKP \
          --disable CONFIG_UH_LKMAUTH \
          --disable CONFIG_UH_LKM_BLOCK \

          # Samsung Real-time Kernel Protection (RKP)
          --disable CONFIG_RKP \
          --disable CONFIG_RKP_CFP \
          --disable CONFIG_RKP_CFP_JOPP \
          --disable CONFIG_RKP_CFP_ROPP \

          # Samsung exploit and privilege-escalation protection
          --disable CONFIG_SECURITY_DEFEX \

          # Samsung process and file integrity protection
          --disable CONFIG_PROCA \
          --disable CONFIG_FIVE \

          # Samsung Kernel Data Protection (KDP)
          --disable CONFIG_KDP \
          --disable CONFIG_KDP_NS

        echo ""
        echo "===== SAMSUNG SECURITY CONFIGURATION ====="
        grep -E 'CONFIG_(UH|RKP|SECURITY_DEFEX|PROCA|FIVE|KDP)' "$DEFCONFIG" || true
        echo "==========================================="

name: Setup Swap Memory
description: Setup Swap Memory

inputs:
  lto:
    description: "LTO mode"
    required: true

runs:
  using: composite
  steps:
    - name: Create Swap File
      shell: bash
      run: |
        SWAPFILE="/swapfile"

        case "${{ inputs.lto }}" in
          full)
            SWAP_SIZE="25G"
            ;;
          thin)
            SWAP_SIZE="12G"
            ;;
          default)
            SWAP_SIZE="8G"
            ;;
          *)
            echo "Error: Unknown LTO mode: ${{ inputs.lto }}"
            exit 1
            ;;
        esac

        echo "Memory and swap before:"
        free -h

        echo "Setting up $SWAP_SIZE swap..."

        if swapon --show=NAME | grep -q "^${SWAPFILE}$"; then
          echo "Swap already enabled."
        else
          sudo fallocate -l "$SWAP_SIZE" "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
        fi

        echo "Memory and swap after:"
        free -h

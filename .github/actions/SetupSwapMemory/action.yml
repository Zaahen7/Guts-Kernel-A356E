name: Setup Swap Memory
description: Setup Swap Memory

inputs:
    swap_size:
      description: "Swap size in GB"
      required: true

runs:
  using: composite
  steps:
    - name: Create Swap File
      shell: bash
      run: |
        SWAPFILE="/swapfile"
        SWAP_SIZE="${{ inputs.swap_size }}G"

        echo "Memory and swap before:"
        free -h

        echo "Setting up $SWAP_SIZE swap..."

        if swapon --show=NAME | grep -q "$SWAPFILE"; then
          echo "Swap already enabled."
        else
          sudo fallocate -l "$SWAP_SIZE" "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
        fi

        echo "Memory and swap after:"
        free -h


name: Build Kernel
description: Build kernel

inputs:
  lto-mode:
    description: "Link Time Optimization(LTO) Mode"
    required: true
  kernel-variant:
    description: "Selected root solution"

runs:
  using: composite
  steps: 
    - name: Configure LTO
      shell: bash
      run: |
        if [[ "${{ inputs['lto-mode'] }}" == "Full" ]]; then
          echo "Enabling Full LTO"
          "$KERNEL_DIR/scripts/config" \
            --file "$DEFCONFIG" \
            --enable CONFIG_LTO_CLANG \
            --disable CONFIG_LTO_NONE \
            --disable CONFIG_LTO_CLANG_THIN \
            --enable CONFIG_LTO_CLANG_FULL
        
        elif [[ "${{ inputs['lto-mode'] }}" == "Thin" ]]; then
          echo "Enabling Thin LTO"
          "$KERNEL_DIR/scripts/config" \
            --file "$DEFCONFIG" \
            --enable CONFIG_LTO_CLANG \
            --disable CONFIG_LTO_NONE \
            --enable CONFIG_LTO_CLANG_THIN \
            --disable CONFIG_LTO_CLANG_FULL
        else
          echo "Living default LTO configs."
        fi
        
        echo "===== LTO CONFIG RESULT ====="
        grep -E 'CONFIG_(LTO|LTO_CLANG)' "$DEFCONFIG"
        echo "============================="

    - name: remove -dirty from kernel uname
      shell: bash
      run: |
        echo "Removing -dirty from kernel uname"
        sed -i "s/printf '%s' -dirty/printf '%s' ''/g" "$KERNEL_DIR/scripts/setlocalversion"
    
    - name: Adjust FinaSU size
      if: ${{ inputs['kernel-variant'] == 'FINASU' }}
      shell: bash
      run: |
        SIZE_BYTES="${FINASU_EXPECTED_SIZE//,/}"  # Remove comas
        FINASU_EXPECTED_SIZE=$(printf '0x%04x' "$SIZE_BYTES") # Convert size
        echo "FINASU_EXPECTED_SIZE=$FINASU_EXPECTED_SIZE" >> "$GITHUB_ENV"

    - name: Calculate KernelSU Version
      if: ${{ inputs['kernel-variant'] != 'CLEAN' }}
      shell: bash
      run: |
        set -euo pipefail

        case "${{ inputs['kernel-variant'] }}" in
          KSU)
            KSU_DIR="$KERNEL_DIR/KernelSU"
            VERSION_OFFSET=30000
            ;;
          KSUN)
            KSU_DIR="$KERNEL_DIR/KernelSU-Next"
            VERSION_OFFSET=30000
            ;;
          FINASU)
            KSU_DIR="$KERNEL_DIR/FinaSU"
            VERSION_OFFSET=30000
            ;;
          BAKASU)
            KSU_DIR="$KERNEL_DIR/KernelSU"
            VERSION_OFFSET=30700
            ;;
        esac

        KSU_COMMIT_COUNT=$(git -C "$KSU_DIR" rev-list --count HEAD)
        KSU_VERSION=$((VERSION_OFFSET + KSU_COMMIT_COUNT))

        echo "${{ inputs['kernel-variant'] }}_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"

    - name: Create Kernel Info.txt & Place it into AnyKernel3
      shell: bash
      run: |
        set -euo pipefail
        INFO_FILE="$ANYKERNEL3_DIR/kernel-info.txt"
        
        cat > "$INFO_FILE" <<EOF
        ==============================
                 KERNEL INFO
        ==============================
        Device: $DEVICE_MODEL
        Kernel Version: $KERNEL_VERSION
        Build Date: $BUILD_DATE
        One UI Version: $ONEUI_VERSION
        LTO Mode: $LTO_MODE
        
        ==============================
               KERNELSU INFO
        ==============================
        Variant: ${{ inputs['kernel-variant'] }}
        Version: ${${{ inputs['kernel-variant'] }}_VERSION:-Unknown}
        
        ==============================
                 GIT HASHES
        ==============================
        EOF
        
        for var in ${{ inputs['kernel-variant'] }}_SHA SUSFS_SHA BBG_SHA HYBRIDMOUNT_SHA NOMOUNT_SHA; do
          value="${!var:-}"
          if [ -n "$value" ]; then
            echo "$var: $value" >> "$INFO_FILE"
          fi
        done
        
        echo "==============================" >> "$INFO_FILE"
        
        echo "✅ Kernel information saved to $INFO_FILE"
        
    - name: Build kernel
      shell: bash
      run: |
        cd "$KERNEL_DIR"
        
        export PATH="$(pwd)/toolchain/clang/host/linux-x86/clang-r450784d/bin:$PATH"
        export PATH="$(pwd)/toolchain/build/kernel/build-tools/path/linux-x86/:$PATH"
        export HOSTCFLAGS="-I$(pwd)/toolchain/prebuilts/kernel-build-tools/linux-x86/include -isystem /usr/include"
        export HOSTLDFLAGS="-L $(pwd)/toolchain/prebuilts/kernel-build-tools/linux-x86/lib64 \
            -Wl,-rpath,$(pwd)/toolchain/prebuilts/kernel-build-tools/linux-x86/lib64 \
            -fuse-ld=lld --rtlib=compiler-rt"
        
        export DTC_FLAGS="-@"
        export PLATFORM_VERSION=13
        export ANDROID_MAJOR_VERSION=t
        export LLVM=1
        export DEPMOD=depmod
        export ARCH=arm64
        export TARGET_SOC=s5e8835
        export LOCALVERSION="-GutsKernel"
        
        KSU_ARGS=(
          KSU_REQUIRE_PREINIT=1
          "KSU_EXPECTED_SIZE=$FINASU_EXPECTED_SIZE"
          "KSU_EXPECTED_HASH=$FINASU_EXPECTED_HASH"
        )
        
        if [[ "${{ inputs['lto-mode'] }}" == "Full" ]]; then
          LTO=full make s5e8835-a35xjvxx_defconfig
          LTO=full make -j"$(nproc)" Image "${KSU_ARGS[@]}"
        elif [[ "${{ inputs['lto-mode'] }}" == "Thin" ]]; then
          LTO=thin make s5e8835-a35xjvxx_defconfig
          LTO=thin make -j"$(nproc)" Image "${KSU_ARGS[@]}"
        else
          make s5e8835-a35xjvxx_defconfig
          make -j"$(nproc)" Image "${KSU_ARGS[@]}"
        fi

name: Build Kernel
description: Build kernel

inputs:
    LinkTO:
        required: true

runs:
  using: composite
  steps:
    - name: Build kernel
      shell: bash
      run: |
        echo Starting Kernel Build...
        echo "===== KERNEL INFO ====="
        echo Kernel Version: $KERNEL_VERSION
        echo One UI $ONEUI_VERSION
        
        cd "$KERNEL_DIR"
        chmod +x build_kernel.sh
        
        if [[ "${{ inputs.lto }}" == "default" ]]; then
          ./build_kernel.sh
        else
          LTO="${{ inputs.lto }}" ./build_kernel.sh
        fi
        


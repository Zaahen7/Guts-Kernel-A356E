name: Prepare to build kernel
description: Create directories and clone repos that will be used

inputs:
  repos_token:
    description: "Repository access token"
    required: true
    
  branch:
    description: "Branch to clone"
    required: true
    
  #lto:
    #description: "LTO mode"
    #required: true
    
  #ksu_variant:
    #description: "KernelSU variant"
    #required: true

  #susfs:
    #description: "Enable SUSFS"
    #required: true

runs:
  using: composite
  steps:
    - name: Configure Git authentication
      env:
        REPOS_TOKEN: ${{ inputs.repos_token }}
      shell: bash
      run: |
        git config --global url."https://x-access-token:${REPOS_TOKEN}@github.com/".insteadOf "https://github.com/"
        
    - name: Prepare directories
      shell: bash
      run: |
        echo "Removing directories..."
        rm -rf "$KERNEL_DIR" "$TOOLCHAIN_DIR"
        
        echo "Creating directories..."
        mkdir "$KERNEL_DIR" "$TOOLCHAIN_DIR"
        echo "Directories created :P"
        
    - name: Clone kernel source
      shell: bash
      run: |
        echo "========================================"
        echo "Building: ${{ inputs.branch }} kernel"
        echo "========================================"

        git clone \
          --depth 1 \
          --single-branch \
          -b "${{ inputs.branch }}" \
          https://github.com/Zaahen7/A356E-KernelSources.git \
          "$KERNEL_DIR"
          
    - name: Samsung Toolchain Setup
      shell: bash
      run: |
        echo "Cloning Samsung toolchain..."
        git clone \
          --depth 1 \
          https://github.com/Zaahen7/A356E-toolchain.git \
          "$TOOLCHAIN_DIR"
          
        echo "Extracting .tar.xz files"
        for archive in "$TOOLCHAIN_DIR"/*.tar.xz; do
          echo "Extracting: $(basename "$archive")"
          tar -xJf "$archive" -C "$TOOLCHAIN_DIR"
          rm -f "$archive"
        done

        echo "Moving toolchain to kernel source..."
        mv "$TOOLCHAIN_DIR/toolchain" "$KERNEL_DIR"
        echo "Done :P"
          
        echo "listado:"
        ls "$toolchain_dir"

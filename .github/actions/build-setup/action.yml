name: Prepare to build kernel
description: Create directories and clone repos that will be used

inputs:
    repos_token:
        description: "Repository access token"
        required: true
        
    branch:
        description: "Kernel Source Branch to clone"
        required: true
        
    kernel_build:
        description: "Kernel type"
        required: true
        
    free_diskspace:
        description: "Enable to free disk space"
        required: true


runs:
  using: composite
  steps:
    - name: Configure Git authentication
      env:
        REPOS_TOKEN: ${{ inputs.repos_token }}
      shell: bash
      run: |
        git config --global url."https://x-access-token:${REPOS_TOKEN}@github.com/".insteadOf "https://github.com/"

    - name: Install dependencies
      shell: bash
      run: |
        echo Installing dependencies...
        sudo apt update
        sudo apt-get install -y libyaml-dev
        echo Done :V

    - name: Free disk space
      if: ${{ inputs.free_diskspace }}
      uses: endersonmenezes/free-disk-space@v3
      with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
        
    - name: Prepare directories
      shell: bash
      run: |
        rm -rf "$KERNEL_DIR" "$TOOLCHAIN_DIR" "$ANYKERNEL3_DIR"
        echo Creating directories...
        mkdir "$KERNEL_DIR" "$TOOLCHAIN_DIR" "$ANYKERNEL3_DIR"
        echo Directories created :P
        
    - name: Clone kernel source
      shell: bash
      run: |
        ONEUI_VERSION="${{ inputs.branch }}"
        ONEUI_VERSION="${ONEUI_VERSION#oneui}"

        echo "One Ui Version: $ONEUI_VERSION"
        echo "ONEUI_VERSION=$ONEUI_VERSION" >> "GITHUB_ENV"

        echo "Cloning One UI $ONEUI_VERSION kernel source..."
        git clone --depth 1 \
          --single-branch \
          -b "${{ inputs.branch }}" \
          https://github.com/Zaahen7/A356E-KernelSources.git \
          "$KERNEL_DIR"
      
    - name: Extract kernel version
      shell: bash
      run: |
        KERNEL_VERSION=$(make -s -C "$KERNEL_DIR" kernelversion)

        echo "Kernel version: $KERNEL_VERSION"
        echo "KERNEL_VERSION=$KERNEL_VERSION" >> "$GITHUB_ENV"
      
    - name: Samsung Toolchain Setup
      shell: bash
      run: |
        echo "Cloning Samsung toolchain..."
        git clone --depth 1 \
          https://github.com/Zaahen7/A356E-toolchain.git \
          "$TOOLCHAIN_DIR"
          
        echo "Extracting .tar.xz files"
        for archive in "$TOOLCHAIN_DIR"/*.tar.xz; do
          echo "Extracting: $(basename "$archive")"
          tar -xJf "$archive" -C "$TOOLCHAIN_DIR"
          rm -f "$archive"
        done

        echo "Moving toolchain to kernel source..."
        mv "$TOOLCHAIN_DIR/toolchain" "$KERNEL_DIR"
        echo "Done :P"

    - name: Clone Anykernel3
      shell: bash
      run: |
        echo Cloning anykernel3...
        git clone --depth 1 \
          https://github.com/Zaahen7/AK3.git \
          "$ANYKERNEL3_DIR"
        echo Done :P
    
    - name: Edit update-binary
      shell: bash
      run: |
        UPDATE_BINARY="$ANYKERNEL3_DIR/META-INF/com/google/android/update-binary"
        
        echo "Editing update-binary..."
        sed -i "s/Zaahen7/$ONEUI_VERSION/g" "$UPDATE_BINARY"
        sed -i "s/7nehaaZ/$KERNEL_VERSION/g" "$UPDATE_BINARY"
        
        echo "update-binary modified successfully."

name: Publish files as Release/Prerelease
description: Publish files

inputs:
  prerelease:
    required: true
  output_files:
      required: true
  oneui_version:
      required: true
  release_name:
    required: true
  release_tag:
    required: true
  release_body:
    required: true
    
runs:
  using: composite
  steps:
    - name: Create Release File directory
      shell: bash
      run: |
        mkdir "$GITHUB_WORKSPACE/release_files"
        echo Created.
        
    - name: Compress Image File
      if: inputs.output_files == 'image' || inputs.output_files == 'both'
      shell: bash
      run: |
        cd "$KERNEL_DIR/arch/arm64/boot"
        zip -9 "$GITHUB_WORKSPACE/release_files/RawImage-A356E-${{ inputs.oneui_version }}.zip" Image
        ls "$GITHUB_WORKSPACE"
        
    - name: Copy Image file to Anykernel3
      if: inputs.output_files == 'flashable-zip' || inputs.output-files == 'both'
      shell: bash
      run: |
        cp "$KERNEL_DIR/arch/arm64/boot/Image" "$ANYKERNEL3_DIR"
        
    - name: Create Flashable Zip
      if: inputs.output_files == 'flashable-zip' || inputs.output_files == 'both'
      shell: bash
      run: |
        cd "$ANYKERNEL3_DIR"
        zip -r9 "$GITHUB_WORKSPACE/release_files/RawKernel-A356E-${{ inputs.oneui_version }}.zip" . \
          -x '.git/*' '.gitignore' 'README.md'

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        prerelease: ${{ inputs.prerelease }}
        name: ${{ inputs.release_name }}
        tag_name: ${{ inputs.release_tag }}
        body: ${{ inputs.release_body }}
        files: ${{ github.workspace }}/release_files/**/*
